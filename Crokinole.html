  if (!g || APP.settings.rotate !== 'on') return 0;
  /* player 0's quadrant already faces the bottom, so only player 2 turns */
  return g.shooter === 0 ? 0 : Math.PI;
};

/* ----------------------------------------------------------------- the HUD */
APP.hud = function(){
  const g = APP.state.game;
  if (!g) return;
  const t = RULES.tally(g.geo, g.world, g.banked);
  const names = ['Player 1', g.match.cfg.mode === 'ai' ? 'Computer' : 'Player 2'];
  el('p1-name').textContent = names[0];
  el('p2-name').textContent = names[1];
  el('p1-pts').textContent = t.pts[0];
  el('p2-pts').textContent = t.pts[1];
  const sub = i => {
    const b = g.twenties[i];
    return b ? `${b} × 20 banked` : 'on the board';
  };
  el('p1-sub').textContent = sub(0);
  el('p2-sub').textContent = sub(1);
  el('pane-p1').classList.toggle('active', g.shooter === 0);
  el('pane-p2').classList.toggle('active', g.shooter === 1);

  const total = g.match.cfg.bestOf;
  el('round-label').textContent = g.match.sudden
    ? 'Sudden-death round'
    : `Round ${Math.min(g.match.round + 1, total)} / ${total}`;
  el('match-label').textContent =
    `Best of ${total} — ${g.match.points[0]} : ${g.match.points[1]}`;

  /* discs still to come */
  for (const i of [0, 1]){
    const track = el('track-p' + (i + 1));
    let html = '';
    for (let k = 0; k < SPEC.DISCS_EACH; k++){
      html += `<div class="disc-pip${k < g.left[i] ? ' left' : ''}"></div>`;
    }
    track.innerHTML = html;
  }
};

APP.prompt = function(main, sub){
  el('prompt-main').textContent = main;
  el('prompt-sub').textContent = sub || '';
};

/* --------------------------------------------------------- the host object */
/* This is everything the game and the input layer are allowed to know about
   the browser. Keeping it in one object is what lets the harness drive a
   whole match with no browser at all. */
APP.host = {
  now(){ return (typeof performance !== 'undefined' ? performance.now() : Date.now()) / 1000; },
  defer(fn, ms){ setTimeout(fn, ms); },
  setting(k){ return APP.settings[k]; },

  onTurn(g){
    APP.hud();
    const who = g.match.cfg.mode === 'ai' && g.shooter === 1 ? 'Computer' : `Player ${g.shooter + 1}`;
    const oppOut = RULES.hasLiveDisc(g.world, 1 - g.shooter);
    APP.prompt(`${who} to shoot`,
      g.isAI(g.shooter) ? 'thinking…'
        : (oppOut ? 'You must hit an opponent disc'
                  : 'Open board — your shot must reach the 15 line')
          + (g.isAI(g.shooter) ? '' : ' · click the disc to arm it'));
    APP.resize();
  },

  onAIChose(think){
    APP.prompt('Computer to shoot', `${think.level} — ${think.considered} shots considered`);
  },

  onShotFired(g, shot, result, verdict){
    SFX.resume();
    SFX.flick(SFX.ctx ? SFX.ctx.currentTime : 0, clamp(hypot(shot.vx, shot.vy) / SPEC.V_MAX_SHOT, 0, 1));
    APP.prompt('Watching the shot', 'Waiting for movement to settle…');
    APP.toast('');
  },

  onEvent(ev, t){
    if (!SFX.ctx || APP.settings.sound !== 'on') return;
    const when = SFX.ctx.currentTime;
    const strength = clamp(ev.impulse / (SPEC.M_DISC * SPEC.V_MAX_SHOT * 1.4), 0, 1);
    if (ev.kind === 'disc') SFX.hitDisc(when, strength);
    else if (ev.kind === 'peg') SFX.hitPeg(when, strength);
    else if (ev.kind === 'hole') SFX.twenty(when);
    else if (ev.kind === 'ditch') SFX.ditch(when);
  },

  onShotSettled(g, verdict, swept, removed){
    APP.hud();
    if (!verdict.valid){
      SFX.foul(SFX.ctx ? SFX.ctx.currentTime : 0);
      APP.toast('FOUL', verdict.text.replace(/^Foul — /, ''), 'foul');
    } else if (swept.sunk.length){
      APP.toast('20', swept.sunk.length > 1 ? `${swept.sunk.length} sunk` : 'in the hole', 'twenty');
    } else if (swept.ditched.length){
      APP.toast('', '');
    }
  },

  onRoundOver(g, t, res){
    SFX.roundEnd(res.winner === 0 || g.match.cfg.mode !== 'ai');
    APP.toast('');
    APP.hud();
    APP.roundModal(g, t, res);
  },

  /* ---- input --------------------------------------------------------
     AIM BY POSITION, NOT BY SPEED. There is no flick left in the game.

       1. CLICK THE DISC to start aiming. (Clicking anywhere else on your
          own line moves the disc there instead.)
       2. MOVE AWAY FROM IT. A line is drawn from the disc through where you
          are, showing exactly where the shot goes -- and the further from
          the disc you are, the harder it is struck.
       3. LIFT YOUR FINGER OFF THE TRACKPAD and it shoots.

     Every version before this took its power from how FAST the hand moved,
     and every one of them was wrong in the same way: speed is not something
     a hand can repeat, it means something different on a trackpad than on
     glass, and it can only be measured at the instant the gesture ends --
     so the trajectory line flashed up and vanished at exactly the moment
     it mattered. Distance has none of those problems. It holds still, it
     reads the same on any device, and the preview can sit there being
     correct for as long as you like while you line the shot up.

     "Lift your finger off" is a real event on glass -- the touch ends. On a
     trackpad it is not: a finger leaving the pad sends nothing, the cursor
     simply stops. So there the shot fires when the cursor HAS STOPPED for a
     moment, with a ring closing around the disc as the moment passes, so it
     is visible and can be called off by moving again.
  */
  pointerDown(px, py, kind){
    const s = APP.state, g = s.game;
    if (!g || g.state !== 'aim' || g.isAI(g.shooter)) return false;
    SFX.resume();
    s.lastKind = kind || s.lastKind;
    s.downT = APP.host.now();
    s.downX = px; s.downY = py;
    s.dragged = false;
    /* on glass the press itself starts the aim; the lift will shoot */
    if (APP.isTouch()) APP.setAiming(true, px, py);
    return true;
  },

  pointerMove(px, py, samples, dx, dy){
    const s = APP.state, g = s.game;
    if (!g || g.state !== 'aim' || !g.pending) return;
    if (hypot(px - dx, py - dy) > APP.TAP_SLOP) s.dragged = true;
    if (!APP.isTouch() || !s.aiming) return;
    APP.aimAt(px, py);
  },

  pointerUp(px, py, vel, dx, dy){
    const s = APP.state, g = s.game;
    if (!g || g.state !== 'aim' || !g.pending) return;
    const moved = hypot(px - dx, py - dy);

    /* --- a tap or click, on either device ------------------------------- */
    if (!s.dragged && moved <= APP.TAP_SLOP && APP.host.now() - s.downT < APP.TAP_TIME){
      const b = RENDER.toBoard(s.view, px, py);
      const onDisc = hypot(b.x - g.pending.x, b.y - g.pending.y) < SPEC.R_DISC * 2.6;
      if (onDisc){
        /* start aiming, or stop if already */
        APP.setAiming(!s.aiming, px, py);
        return;
      }
      if (s.aiming){ APP.setAiming(false); return; }   /* a click cancels   */
      const pl = g.geo.placement(g.shooter);
      if (Math.abs(angDiff(pl.c, Math.atan2(b.y, b.x))) <= pl.halfSpan + 0.52){
        g.place(b.x, b.y);
        SFX.ui(false);
        APP.prompt(`Player ${g.shooter + 1} to shoot`, 'Click the disc, then move away from it to aim');
      }
      return;
    }

    /* --- glass: lifting off is the shot -------------------------------- */
    if (APP.isTouch() && s.aiming) APP.fireAim(g);
  },

  /* A trackpad reports movement with nothing held. That IS the aim. */
  pointerHover(px, py, samples, kind){
    const s = APP.state, g = s.game;
    if (!g || g.state !== 'aim' || !g.pending || g.isAI(g.shooter)) return;
    s.lastKind = kind || s.lastKind;
    if (!s.aiming || APP.isTouch()) return;
    APP.aimAt(px, py);
  },

  pointerCancel(){
    const s = APP.state;
    if (s.aiming) APP.setAiming(false);
    s.dragged = false;
  },
};

/* ---- aiming ------------------------------------------------------------ */

APP.setAiming = function(on, px, py){
  const s = APP.state, g = s.game;
  s.aiming = !!on;
  s.aimHeldSince = 0;
  if (!on){
    if (g) g.cancelAim();
    if (g) APP.prompt(`Player ${g.shooter + 1} to shoot`,
                      APP.isTouch() ? 'Touch and drag away from the disc, then let go'
                                    : 'Click the disc, then move away from it to aim');
    return;
  }
  SFX.ui(true);
  if (px !== undefined) APP.aimAt(px, py);
  if (g) APP.prompt(`Player ${g.shooter + 1} to shoot`,
                    APP.isTouch() ? 'Further from the disc is harder — let go to shoot'
                                  : 'Further from the disc is harder — stop moving to shoot');
};

/* The shot a given cursor position describes. Direction is from the disc
   towards the cursor; force is how far away the cursor is. Nothing here
   depends on time, so the preview is steady and the same position always
   gives the same shot. */
APP.aimShot = function(g, px, py){
  if (!g.pending) return null;
  const b = RENDER.toBoard(APP.state.view, px, py);
  let ax = b.x - g.pending.x, ay = b.y - g.pending.y;
  const dist = hypot(ax, ay);
  if (dist < SPEC.AIM_MIN) return null;

  /* HOW FAR THE CURSOR IS FROM THE DISC IS HOW HARD IT IS STRUCK, across
     the whole range, with full power at AIM_FULL.

     The first version of this made the disc stop exactly under the cursor
     -- elegant, since it is just the friction law solved backwards, and
     completely unplayable. A disc that stops where you point always arrives
     with NOTHING left, so nothing could ever be knocked anywhere: to hit
     hard you had to aim far past the target, and the screen ran out long
     before the power did. The disc only ever went slow.

     So the mapping spans the real range instead, and AIM_FULL is set to a
     distance that is comfortably reachable on screen. Honesty does not
     depend on the rule being 1:1 -- the dashed ring in the preview marks
     where the disc will actually stop, which is usually well past the
     cursor, and that IS the truth about the shot. */
  const t = clamp((dist - SPEC.AIM_MIN) / (SPEC.AIM_FULL - SPEC.AIM_MIN), 0, 1);
  const speed = SPEC.V_MIN_SHOT + (SPEC.V_MAX_SHOT - SPEC.V_MIN_SHOT) * t;
  const shot = INPUT.buildFlick(SPEC, {
    owner: g.shooter, x: g.pending.x, y: g.pending.y,
    dirX: ax, dirY: ay, speed, lateralFrac: 0,
  });
  return shot ? { shot, power: speed / SPEC.V_MAX_SHOT, aim: b } : null;
};

APP.aimAt = function(px, py){
  const s = APP.state, g = s.game;
  if (!g || !s.aiming) return;
  s.aimPx = px; s.aimPy = py;
  s.aimHeldSince = APP.host.now();        /* the stop-to-shoot clock resets */
  const m = APP.aimShot(g, px, py);
  g.setAim(m ? m.shot : null, m ? m.power : 0, m ? m.aim : null);
  /* say the power out loud as it climbs -- without it there is no way to
     tell a half-power shot from a full one until it is already gone */
  const pc = m ? Math.round(m.power * 100) : 0;
  APP.prompt(`Player ${g.shooter + 1} to shoot`,
    pc <= 0 ? 'Move further from the disc'
            : `${pc}% power — ` + (APP.isTouch() ? 'let go to shoot'
                                                 : 'stop moving to shoot'));
};

APP.fireAim = function(g){
  const s = APP.state;
  const m = APP.aimShot(g, s.aimPx, s.aimPy);
  APP.setAiming(false);
  if (!m){
    APP.prompt(`Player ${g.shooter + 1} to shoot`, 'Too close to the disc — move further away');
    return;
  }
  g.takeShot(m.shot);
};

/* ------------------------------------------------------------- the modals */
APP.roundModal = function(g, t, res){
  const m = g.match;
  const names = ['Player 1', m.cfg.mode === 'ai' ? 'Computer' : 'Player 2'];
  const rows = m.history.map((h, i) => `
    <tr><td>Round ${i + 1}</td>
        <td class="v" style="color:var(--p1)">${h.pts[0]}</td>
        <td class="v" style="color:var(--p2)">${h.pts[1]}</td>
        <td>${h.matchPts[0]} : ${h.matchPts[1]}</td></tr>`).join('');

  if (m.over){
    const w = m.winner;
    APP.modal(`
      <h2 class="win">${names[w]} wins</h2>
      <p class="lede">Best of ${m.cfg.bestOf} — ${m.points[0]} : ${m.points[1]}</p>
      <table class="tally">
        <tr><th>&nbsp;</th><th>${names[0]}</th><th>${names[1]}</th><th>Match</th></tr>
        ${rows}
        <tr class="total"><td>Discs</td><td>${m.tally[0]}</td><td>${m.tally[1]}</td><td></td></tr>
        <tr class="total"><td>20s</td><td>${m.twenties[0]}</td><td>${m.twenties[1]}</td><td></td></tr>
      </table>
      <button class="btn hot" id="md-again">Play again</button>
      <button class="btn ghost" id="md-menu">Main menu</button>`);
    el('md-again').onclick = () => { SFX.ui(true); APP.modal(null); APP.startGame(); };
    el('md-menu').onclick  = () => { SFX.ui(false); APP.modal(null); APP.show('menu'); };
    return;
  }

  const head = res.winner < 0 ? 'Round tied'
             : `${names[res.winner]} takes the round`;
  APP.modal(`
    <h2>${head}</h2>
    <p class="lede">${t.pts[0]} — ${t.pts[1]} on the board${m.sudden ? ' · sudden death next' : ''}</p>
    <table class="tally">
      <tr><th>&nbsp;</th><th>${names[0]}</th><th>${names[1]}</th><th>Match</th></tr>
      ${rows}
    </table>
    <button class="btn hot" id="md-next">${m.sudden ? 'Sudden-death round' : 'Next round'}</button>`);
  el('md-next').onclick = () => {
    SFX.ui(true); APP.modal(null); g.nextRound(); APP.hud();
  };
};

APP.pauseModal = function(){
  const g = APP.state.game;
  APP.modal(`
    <h2>Paused</h2>
    <p class="lede">${g ? `Round ${g.match.round + 1} of ${g.match.cfg.bestOf}` : ''}</p>
    <button class="btn hot" id="pm-resume">Resume</button>
    <button class="btn" id="pm-restart">Restart match</button>
    <button class="btn ghost" id="pm-menu">Main menu</button>`);
  el('pm-resume').onclick  = () => { SFX.ui(true); APP.modal(null); };
  el('pm-restart').onclick = () => { SFX.ui(false); APP.modal(null); APP.startGame(); };
  el('pm-menu').onclick    = () => { SFX.ui(false); APP.modal(null); APP.show('menu'); };
};

/* --------------------------------------------------------------- the loop */
APP.loop = function(ts){
  const s = APP.state;
  APP.state.raf = requestAnimationFrame(APP.loop);
  const now = ts / 1000;
  let dt = s.last ? now - s.last : 0;
  s.last = now;
  /* a backgrounded tab hands back an enormous dt; clamp it or a shot would
     jump to its end */
  if (dt > 0.1) dt = 0.1;

  if (s.screen !== 'game' || !s.game) return;
  const g = s.game;

  if (!el('modal').classList.contains('on')) g.advance(dt);

  /* STOP MOVING TO SHOOT, on a trackpad. A finger leaving the pad sends no
     event -- the cursor just stops -- so a pause of AIM_SETTLE is what
     "took the finger off" looks like from in here. The ring closing around
     the disc makes the wait visible, and moving again calls it off. */
  if (s.aiming && !APP.isTouch() && s.aimHeldSince){
    const held = APP.host.now() - s.aimHeldSince;
    s.aimSettle = clamp(held / APP.AIM_SETTLE, 0, 1);
    if (held >= APP.AIM_SETTLE && g.power > 0) APP.fireAim(g);
  } else s.aimSettle = 0;

  if (s.toastT > 0){
    s.toastT -= dt;
    if (s.toastT <= 0) APP.toast('');
  }

  const vs = g.viewState();
  vs.clock = now;
  RENDER.frame(s.ctx, s.view, g.geo, vs);
};

/* ---------------------------------------------------------------- startup */
APP.startGame = function(){
  const s = APP.state;
  s.game = GAME.create(APP.host);
  s.game.startMatch({
    mode: APP.setup.mode, bestOf: APP.setup.bestOf,
    difficulty: APP.setup.difficulty,
    /* a fixed seed makes any match reproducible; the harness relies on it
       and so does anyone reporting a bug */
    seed: 20260903,
  });
  APP.show('game');
  APP.resize();
  APP.hud();
};

APP.setupHint = function(){
  const h = el('su-hint');
  const d = APP.setup.difficulty;
  const need = Math.floor(APP.setup.bestOf / 2) + 1;
  const modeTxt = APP.setup.mode === 'ai'
    ? { easy:   'Easy aims sensibly and misses a lot — about two degrees of error and a fifth of its power.',
        medium: 'Medium searches harder and misses less. It will take your discs off the board when it can.',
        hard:   'Hard refines its aim, banks off the pegs, and hits what it means to. It is not kind.' }[d]
    : 'Two players on one iPad. The board turns to face whoever is shooting.';
  h.textContent = `${modeTxt} ${APP.setup.bestOf === 1 ? 'One round decides it.'
      : `First to ${need} round${need > 1 ? 's' : ''} wins; a tied round scores one point each.`}`;
  el('row-difficulty').style.opacity = APP.setup.mode === 'ai' ? '1' : '0.35';
  el('row-difficulty').style.pointerEvents = APP.setup.mode === 'ai' ? 'auto' : 'none';
};

APP.modeButtons = function(){
  el('su-mode-local').setAttribute('aria-pressed', String(APP.setup.mode === 'local'));
  el('su-mode-ai').setAttribute('aria-pressed', String(APP.setup.mode === 'ai'));
  el('su-mode-local').classList.toggle('hot', APP.setup.mode === 'local');
  el('su-mode-ai').classList.toggle('hot', APP.setup.mode === 'ai');
};

APP.init = function(){
  const s = APP.state;
  s.canvas = el('board-canvas');
  s.ctx = s.canvas.getContext('2d');
  s.view = RENDER.newView();

  /* menu */
  el('mm-practice').onclick = () => { SFX.ui(true); APP.show('setup'); APP.setupHint(); APP.modeButtons(); };
  el('mm-settings').onclick = () => { SFX.ui(false); APP.show('settings'); };
  el('mm-credits').onclick  = () => { SFX.ui(false); APP.show('credits'); };

  /* setup */
  el('su-mode-local').onclick = () => { SFX.ui(false); APP.setup.mode = 'local'; APP.modeButtons(); APP.setupHint(); };
  el('su-mode-ai').onclick    = () => { SFX.ui(false); APP.setup.mode = 'ai';    APP.modeButtons(); APP.setupHint(); };
  seg('su-bestof',     'bestOf',     APP.setup, APP.setupHint);
  seg('su-difficulty', 'difficulty', APP.setup, APP.setupHint);
  el('su-start').onclick = () => { SFX.ui(true); APP.startGame(); };
  el('su-back').onclick  = () => { SFX.ui(false); APP.show('menu'); };

  /* settings */
  seg('set-preview', 'preview', APP.settings, APP.settingsHint);
  seg('set-rotate',  'rotate',  APP.settings, () => { APP.settingsHint(); APP.resize(); });
  seg('set-sound',   'sound',   APP.settings, v => { SFX.on = v === 'on'; APP.settingsHint(); });
  seg('set-labels',  'labels',  APP.settings, APP.settingsHint);
  el('set-back').onclick = () => { SFX.ui(false); APP.show('menu'); };
  APP.settingsHint();

  /* credits */
  el('credits-body').innerHTML = APP.creditsHTML();
  el('cr-back').onclick = () => { SFX.ui(false); APP.show('menu'); };

  /* game */
  el('btn-pause').onclick = () => { SFX.ui(false); APP.pauseModal(); };

  INPUT.attach(s.canvas, APP.host);
  window.addEventListener('resize', APP.resize);
  window.addEventListener('orientationchange', () => setTimeout(APP.resize, 120));
  APP.resize();
  APP.state.raf = requestAnimationFrame(APP.loop);
};

APP.settingsHint = function(){
  const t = {
    flick: 'Flick: click the disc to arm it, then flick the trackpad. Nothing is held down — the movement itself is the shot, and it fires as the flick ends. The way you move is the way the disc goes.',
    sling: 'Slingshot: click the disc to arm it, move away from where you want it to go, and click again to release. Power is how far the cursor is from the disc, so you can set it exactly and hold it while you line the angle up.',
  }[APP.settings.input];
  const p = {
    full:  'Full preview draws the whole shot and shows where every disc will finish.',
    short: 'Short preview stops at the first contact.',
    off:   'No preview. Just the aim arrow.',
  }[APP.settings.preview];
  el('set-hint').textContent = t + ' ' + p;
};
/* ==========================================================================
   12. CREDITS -- and the honest small print
   ========================================================================== */

APP.creditsHTML = function(){
  const P = SPEC;
  const mm = m => (m * 1000).toFixed(1);
  return `
<h3>The rules</h3>
<p>Scoring, shot validity and the shape of a round follow the
<b>National Crokinole Association</b>'s <i>Official Rules of Crokinole</i>
(ratified 6 May 2026), cross-checked against the <b>World Crokinole
Championship</b> rules and <b>Crokinole Canada</b>'s rulebook. Where they
disagree, the NCA wins and the disagreement is written down in the project's
research notes rather than smoothed over.</p>
<ul>
<li>A round is 8 discs each, shot alternately. The winner of a round scores
<b>2</b> points, a tied round scores <b>1</b> each. The raw disc tally decides
only who won — it is not the score. (The "winner takes the difference, first
to 100" system is the traditional house game, not the tournament one.)</li>
<li>With an opponent disc on the board you must hit one, directly or by
bumping your own disc into it. With the board clear, your shot must reach
<b>touching or inside</b> the 15 line — though a disc merely touching that
line still only <b>scores 10</b>. Both are implemented, separately.</li>
<li>A foul removes your shooting disc and everything it disturbed, and voids
a 20 sunk on that shot. Nothing is put back where it was.</li>
<li>A 20 is lifted out and banked after the turn. It is safe for the rest of
the round.</li>
<li>The 12-inch circle is both the line you shoot from and the line that puts
a resting disc out of play.</li>
</ul>

<h3>The board</h3>
<p>Every dimension is the NCA tournament standard, in millimetres:</p>
<ul>
<li>Playing surface <code>${mm(P.R_SURFACE * 2)}</code> across, standing
<code>${mm(P.SURF_RAISE)}</code> above a <code>${mm(P.DITCH_W)}</code> ditch</li>
<li>Scoring circles at radii <code>${mm(P.R_15)}</code> (15),
<code>${mm(P.R_10)}</code> (10) and <code>${mm(P.R_OUT)}</code> (the shooting
line) — published as radii, which is the commonest thing to get wrong by a
factor of two</li>
<li>20 hole <code>${mm(P.R_HOLE * 2)}</code> across and
<code>${mm(P.HOLE_DEPTH)}</code> deep, against a <code>${mm(P.R_DISC * 2)}</code>
disc — so "completely in the hole" means the centre within
<code>${mm(P.R_CAPTURE)}</code> of dead centre. That is why a 20 is hard.</li>
<li>Eight pegs on the 15 circle, offset 22.5° from the quadrant lines, so
every player faces a clean gap. The clear space between two pegs leaves a
disc <code>${mm((2 * P.R_PEG_CIRCLE * Math.sin(Math.PI / P.N_PEGS) - 2 * P.R_PEG - 2 * P.R_DISC) / 2)}</code>
either side of the middle of the lane.</li>
</ul>

<h3>The physics</h3>
<p>A purpose-built rigid-disc solver, not a library. Surface friction is
<b>dry Coulomb friction</b> — constant force, speed falling linearly, and the
disc actually stops — rather than the <code>v *= 0.98</code> exponential decay
that flick games usually use and that never stops at all. It is why hitting
twice as hard goes four times as far, which is the touch the real game has.</p>
<p>Sliding and spinning share one friction budget and die together. A
spinning disc travels further and throws what it hits sideways, but it does
<b>not</b> curve: for a symmetric disc under uniform pressure the friction
force is exactly opposite the direction of travel, and curving it would be a
lie that felt good for a minute.</p>
<p><b>The trajectory preview is not an estimate.</b> It is the actual shot,
run to rest by the same solver that runs when you let go, drawn. The
prediction cannot disagree with the outcome because the same numbers made
both.</p>

<h3>What is honestly not measured</h3>
<p>The board geometry is published and exact. The friction and bounce values
are <b>calibrated, not measured</b>, and there is no honest way around that:
the NCA regulates who may wax a board but not how much, officials may re-wax
it mid-tournament, and vendors sell deliberately bouncier pegs. Playing speed
is a property of the afternoon, not of the sport. Every such constant is
tagged <code>[CALIBRATED]</code> in the source with the reasoning next to it.</p>
<p>Two real differences from a physical board, written down rather than
hidden: discs cannot ride up on top of one another, so the NCA's stacking and
leaning edge cases cannot arise; and a disc that reaches the ditch has
dropped half an inch below the surface and cannot return, so the Damage Stays
Rule never fires.</p>

<h3>Built with</h3>
<p>One HTML file. No build step, no server, no dependencies, no network, and
no <code>Math.random</code> — randomness comes from a seeded generator, so the
same match replays exactly and any bug can be reproduced.</p>`;
};

   13. BOOT
   --------------------------------------------------------------------------
   window.CROK is the whole program's seam. The harness in harness/ reads
   this file, evaluates this script with browser stubs, and asks the shipped
   program questions through this object -- so the thing tested is the thing
   shipped, not a copy of it.
   ========================================================================== */

CROK.build = '2026-09-03a';
window.CROK = CROK;

if (typeof document !== 'undefined' && document.getElementById &&
    document.getElementById('board-canvas')){
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', () => APP.init());
  } else {
    APP.init();
  }
}
</script>
