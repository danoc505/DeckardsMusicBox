           text: 'Foul — with the board open your shot must reach the 15 line' };
};

/* ==========================================================================
   5b. THE PRICE OF A FOUL
   --------------------------------------------------------------------------
   NCA Rule 3b: "the shooting disc and all of the other discs that were
   struck, including any 20s made, shall be removed, considered out-of-play,
   and shall not score."

   The NCA wording is colour-agnostic ("all of the other discs"); the WCC and
   Crokinole Canada say "all the other discs of the same colour". The two can
   never actually disagree: any shot that struck an opponent disc was legal
   by definition, so on an illegal shot the only discs that CAN have been
   struck are the shooter's own. NCA wording is implemented, and the harness
   asserts the equivalence rather than trusting this paragraph.
   ========================================================================== */

RULES.applyFoul = function(result){
  const removed = [];
  for (const d of result.world.discs){
    if (d.shooter || d.moved){
      if (d.fate === 'hole') d.voided20 = true;   /* Rule 3b: it shall not score */
      d.live = false;
      d.fate = 'foul';
      removed.push(d.id);
    }
  }
  return removed;
};

/* ==========================================================================
   5c. END OF TURN -- bank the 20s, sweep the dead
   --------------------------------------------------------------------------
   Rule 2a.ii: 20s are lifted out after the turn and are safe for the round.
   Rule 8e/8f: a disc at rest touching or across the shooting line is out of
   play and goes in the ditch before the next player's turn.

   The ordering matters and is deliberate: a disc that has drifted out past
   the shooting line is STILL A PHYSICAL OBSTACLE during the shot that put
   it there -- nobody picks it up mid-flight -- and only becomes dead once
   everything has stopped. So this runs after the solver, never inside it.
   ========================================================================== */

RULES.endTurn = function(geo, world, banked, twenties){
  const out = { sunk: [], ditched: [] };
  for (const d of world.discs){
    if (d.fate === 'hole' && !d.banked && !d.voided20){
      d.banked = true;
      banked[d.owner] += 20;
      twenties[d.owner] += 1;
      out.sunk.push(d.id);
    }
    if (d.live && geo.deadAtRest(d.x, d.y)){
      d.live = false; d.fate = 'ditch';
      out.ditched.push(d.id);
    }
  }
  return out;
};

/* ==========================================================================
   5d. WHAT IS ON THE BOARD RIGHT NOW
   ========================================================================== */

RULES.tally = function(geo, world, banked){
  const pts = [banked ? banked[0] : 0, banked ? banked[1] : 0];
  const zones = [[], []];
  for (const d of world.discs){
    if (!d.live) continue;
    const z = geo.zoneOf(d.x, d.y);
    pts[d.owner] += z;
    zones[d.owner].push(z);
  }
  return { pts, zones };
};

/* ==========================================================================
   5e. THE MATCH
   --------------------------------------------------------------------------
   [INTERPRETATION] The NCA hierarchy is round (8 discs each) -> game
   (exactly 4 rounds, scored out of 8) -> match (length "determined by the
   tournament rules" -- Rule 2c deliberately leaves it open).

   Practice Mode is a best-of-X ROUNDS match, X = 1/3/5/7, because that is
   what a practice session wants: a best-of-7 GAMES match at NCA lengths
   would be 28 rounds and 448 shots. The NCA round scoring is kept exactly
   -- 2 for a win, 1 each for a tie -- so the numbers on screen are the
   numbers a real scorecard would carry, and 20s are tracked separately
   the way a real scorecard tracks them.

   The match ends as soon as it is decided: when one player's lead is bigger
   than all the points still available. If X rounds finish level, one
   sudden-death round is played, and repeated if needed, so a match can
   never end undecided.
   ========================================================================== */

RULES.newMatch = function(cfg){
  return {
    cfg,
    points:    [0, 0],      /* NCA match points: 2 a win, 1 a tie          */
    twenties:  [0, 0],      /* tracked separately, as a scorecard does     */
    tally:     [0, 0],      /* cumulative raw disc points, for interest    */
    history:   [],          /* per round: {pts, matchPts, winner, twenties}*/
    round:     0,
    firstShooter: 0,
    over:      false,
    winner:    -1,
    sudden:    false,
  };
};

RULES.finishRound = function(match, pts, twenties){
  const winner = pts[0] > pts[1] ? 0 : pts[1] > pts[0] ? 1 : -1;
  const gained = winner < 0 ? [RULES.TIE_PTS, RULES.TIE_PTS]
                            : (winner === 0 ? [RULES.WIN_PTS, 0] : [0, RULES.WIN_PTS]);
  match.points[0] += gained[0];
  match.points[1] += gained[1];
  match.tally[0]  += pts[0];
  match.tally[1]  += pts[1];
  match.twenties[0] += twenties[0];
  match.twenties[1] += twenties[1];
  match.history.push({ pts: [pts[0], pts[1]], matchPts: gained, winner,
                       twenties: [twenties[0], twenties[1]] });
  match.round++;

  /* decided as soon as the lead cannot be caught */
  const played = match.round;
  const left = Math.max(0, match.cfg.bestOf - played);
  const avail = left * RULES.WIN_PTS;
  const lead = Math.abs(match.points[0] - match.points[1]);
  if (lead > avail){
    match.over = true;
    match.winner = match.points[0] > match.points[1] ? 0 : 1;
    match.sudden = false;
  } else if (played >= match.cfg.bestOf){
    if (match.points[0] !== match.points[1]){
      match.over = true;
      match.winner = match.points[0] > match.points[1] ? 0 : 1;
      match.sudden = false;
    } else {
      match.sudden = true;      /* level after the distance: play another   */
    }
  }
  match.firstShooter = 1 - match.firstShooter;   /* NCA Rule 4b            */
  return { winner, gained };
};
/* ==========================================================================
   6. INPUT -- the flick
   --------------------------------------------------------------------------
   Pointer Events only, one code path for every device. On iPadOS a finger
   arrives as pointerType 'touch' and the Magic Keyboard trackpad (or any
   Bluetooth mouse) arrives as pointerType 'mouse' with real hover and real
   button state -- so a trackpad is not a special case here, it is the same
   gesture performed by a cursor. Apple Pencil arrives as 'pen'. All three
   work without a branch.

   THE GESTURE, and why it is built this way

     Touch down in your own quadrant   -> the disc is placed, snapped to the
                                          nearest legal spot on your line.
     Drag while still near the disc    -> the disc SLIDES along the legal
                                          arc. This is placement, not aiming.
     Drag away from the disc           -> the disc locks and you are aiming.
     Release                           -> the flick.

     AIM comes from the direction disc -> finger, not from the direction the
     finger happens to be travelling at the instant you let go. That matters:
     a fast swipe's instantaneous direction is noisy at the last sample and
     aiming a crokinole shot is a game of half a degree. Pointing is stable
     and the preview line shows exactly what you are pointing at.

     POWER comes from how fast you moved (velocity mode, the default) or from
     how far you pulled back (pull-back mode, in Settings). Velocity is the
     one the brief asks for and the one that feels like a flick; pull-back is
     there because it is easier to be precise with and some players will
     want it.

     SPIN comes from the SIDEWAYS part of your release. Flick straight along
     your aim and the disc goes straight. Sweep across as you let go and it
     spins -- which is exactly what putting your fingernail off-centre on a
     real disc does. The sideways fraction is converted to a strike offset b
     from the disc's centre, clamped to the rim (you cannot hit a disc
     further off-centre than its own edge), and then

         omega = b * m * |v| / I

     which is just angular impulse over moment of inertia. Nothing is
     invented; the gesture is measured and handed to the solver.

   VELOCITY ESTIMATION
     Release speed is the least reliable number a touchscreen gives you: the
     final sample is often short, doubled, or delivered late. UIKit and
     Android both solve this by fitting recent motion rather than trusting
     the last delta, and so do we -- a least-squares fit of position against
     time over a short trailing window (VEL_WINDOW), discarding samples
     older than that, which is robust to one bad sample and to variable
     event rates (60Hz, 120Hz ProMotion, or a trackpad's bursts).
   ========================================================================== */

const INPUT = {};
CROK.INPUT = INPUT;

INPUT.VEL_WINDOW   = 0.085;   /* seconds of trailing motion to fit         */
INPUT.VEL_MIN_PTS  = 3;
INPUT.PLACE_GRAB   = 2.6;     /* finger within this many disc radii = placing */

/* Fit vx, vy by least squares over the trailing window. Returns m/s in
   SCREEN pixels; the caller converts to board metres. */
function fitVelocity(samples, now, window){
  let n = 0, sT = 0, sT2 = 0, sX = 0, sY = 0, sTX = 0, sTY = 0;
  for (let i = samples.length - 1; i >= 0; i--){
    const s = samples[i];
    const dt = now - s.t;
    if (dt > window) break;
    const t = -dt;                       /* t = 0 at release, negative back */
    n++; sT += t; sT2 += t * t; sX += s.x; sY += s.y; sTX += t * s.x; sTY += t * s.y;
  }
  if (n < INPUT.VEL_MIN_PTS) return { vx: 0, vy: 0, n };
  const den = n * sT2 - sT * sT;
  if (Math.abs(den) < 1e-12) return { vx: 0, vy: 0, n };
  return { vx: (n * sTX - sT * sX) / den, vy: (n * sTY - sT * sY) / den, n };
}
INPUT.fitVelocity = fitVelocity;

/* ==========================================================================
   6a. FLICK -> SHOT
   --------------------------------------------------------------------------
   Turn the gesture into the five numbers the solver wants: where the disc
   is, how fast it is going, in what direction, and how much it is spinning.
   Kept as a pure function of plain numbers so the harness can check the
   mapping without a browser, a canvas or a finger.
   ========================================================================== */

/* A FLICK. Direction and power both come from the swipe itself: you flick
   the disc the way you want it to go, exactly as you would with a finger on
   a real board. Nothing is aimed by pointing at a target.

   Spin comes from the swipe CURVING. The overall direction of the gesture
   and the direction it is travelling at the moment you let go are compared;
   if they differ you have swept across the disc rather than through it, and
   that is an off-centre strike. A straight flick puts no spin on. */
INPUT.buildFlick = function(P, opts){
  const { owner, x, y, dirX, dirY, speed } = opts;
  const L = hypot(dirX, dirY);
  if (L < 1e-9) return null;
  const ax = dirX / L, ay = dirY / L;
  const v = clamp(speed, 0, P.V_MAX_SHOT);
  if (v < P.V_MIN_SHOT) return null;

  let w = 0;
  if (opts.lateralFrac){
    const b = clamp(opts.lateralFrac * P.SPIN_REACH, -1, 1) * P.R_DISC;
    w = -(b * P.M_DISC * v) / P.I_DISC;
  }
  return { owner, x, y, vx: ax * v, vy: ay * v, w, speed: v,
           aimAngle: Math.atan2(ay, ax) };
};

INPUT.buildShot = function(P, opts){
  const { owner, x, y, aimX, aimY, mode } = opts;
  /* aim: disc -> finger, normalised */
  let ax = aimX - x, ay = aimY - y;
  const aLen = hypot(ax, ay);
  if (aLen < 1e-9) return null;
  ax /= aLen; ay /= aLen;

  /* power */
  let speed;
  if (mode === 'pullback'){
    /* pull distance in disc radii -> speed, linear and honest */
    const pull = clamp(aLen / P.R_DISC, 0, P.PULL_MAX_RADII);
    speed = (pull / P.PULL_MAX_RADII) * P.V_MAX_SHOT;
  } else {
    /* release speed in board metres/second, mapped through a gain. The gain
       exists because a finger cannot physically move as fast as a flicked
       disc leaves the fingernail -- a real flick is a lever, and the disc
       leaves at several times the speed the finger was travelling. */
    speed = clamp(opts.releaseSpeed * P.FLICK_GAIN, 0, P.V_MAX_SHOT);
  }
  if (speed < P.V_MIN_SHOT) speed = 0;

  /* spin from the sideways fraction of the release */
  let w = 0;
  if (speed > 0 && opts.lateralFrac){
    const b = clamp(opts.lateralFrac * P.SPIN_REACH, -1, 1) * P.R_DISC;
    w = -(b * P.M_DISC * speed) / P.I_DISC;
  }

  return { owner, x, y, vx: ax * speed, vy: ay * speed, w, speed, aimAngle: Math.atan2(ay, ax) };
};

/* ==========================================================================
   6b. THE POINTER PLUMBING
   --------------------------------------------------------------------------
   This part only carries pointers and measures speed. It deliberately does
   NOT decide whether you are placing a disc or aiming it -- that is a
   question about the board, and the board's owner answers it. Keeping the
   split here is what lets the whole gesture be tested without a browser.
   ========================================================================== */

INPUT.attach = function(canvas, host){
  const st = { active: false, id: -1, kind: 'touch', samples: [],
               downX: 0, downY: 0, curX: 0, curY: 0,
               hover: [], hoverX: 0, hoverY: 0 };
  INPUT.state = st;

  function pt(e){
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function down(e){
    if (st.active) return;
    const p = pt(e);
    if (!host.pointerDown(p.x, p.y, e.pointerType || 'touch')) return;
    st.active = true; st.id = e.pointerId; st.kind = e.pointerType || 'touch';
    st.downX = st.curX = p.x; st.downY = st.curY = p.y;
    st.samples.length = 0;
    st.samples.push({ x: p.x, y: p.y, t: host.now() });
    try { canvas.setPointerCapture(e.pointerId); } catch (_){}
    if (e.cancelable) e.preventDefault();
  }

  /* A pointermove with no button held is a HOVER -- which on a trackpad or
     mouse is the whole point: the flick is the movement itself, with
     nothing pressed. Touch and pen have no hover, so they never arrive
     here with buttons === 0 and fall through to the drag path below. */
  function hover(e){
    const list = (typeof e.getCoalescedEvents === 'function' && e.getCoalescedEvents().length)
      ? e.getCoalescedEvents() : [e];
    const t = host.now();
    for (const ev of list){
      const p = pt(ev);
      st.hoverX = p.x; st.hoverY = p.y;
      st.hover.push({ x: p.x, y: p.y, t });
    }
    const cut = t - INPUT.VEL_WINDOW * 3;
    while (st.hover.length > 2 && st.hover[0].t < cut) st.hover.shift();
    host.pointerHover(st.hoverX, st.hoverY, st.hover, e.pointerType || 'mouse');
  }

  function move(e){
    if (!st.active){ hover(e); return; }
    if (e.pointerId !== st.id) return;
    /* getCoalescedEvents hands back every sample the compositor merged into
       this one event. On a 120 Hz iPad that is the difference between a
       clean velocity fit and a jagged one. */
    const list = (typeof e.getCoalescedEvents === 'function' && e.getCoalescedEvents().length)
      ? e.getCoalescedEvents() : [e];
    const t = host.now();
    for (const ev of list){
      const p = pt(ev);
      st.curX = p.x; st.curY = p.y;
      st.samples.push({ x: p.x, y: p.y, t });
    }
    /* an unbounded history is a leak in a long game, and nothing older than
       a few fit windows can matter */
    const cut = t - INPUT.VEL_WINDOW * 3;
    while (st.samples.length > 2 && st.samples[0].t < cut) st.samples.shift();
    host.pointerMove(st.curX, st.curY, st.samples, st.downX, st.downY);
    if (e.cancelable) e.preventDefault();
  }

  function up(e, cancelled){
    if (!st.active || e.pointerId !== st.id) return;
    st.active = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_){}
    if (cancelled) host.pointerCancel();
    else {
      const v = fitVelocity(st.samples, host.now(), INPUT.VEL_WINDOW);
      host.pointerUp(st.curX, st.curY, v, st.downX, st.downY);
    }
    st.samples.length = 0;
    if (e.cancelable) e.preventDefault();
  }

  canvas.addEventListener('pointerdown',   down, { passive: false });
  canvas.addEventListener('pointermove',   move, { passive: false });
  canvas.addEventListener('pointerup',     e => up(e, false), { passive: false });
  canvas.addEventListener('pointercancel', e => up(e, true),  { passive: false });

  /* Belt and braces. touch-action:none in the stylesheet is the modern
     answer, but older iPadOS still needs the raw touch stream eaten to stop
     rubber-band scrolling, pinch zoom, double-tap zoom and the long-press
     callout, and Safari's gesture events are not covered by touch-action
     at all. passive:false is required or preventDefault is ignored. */
  const eat = e => { if (e.cancelable) e.preventDefault(); };
  for (const ev of ['touchstart', 'touchmove', 'touchend', 'gesturestart',
                    'gesturechange', 'gestureend', 'contextmenu']){
    canvas.addEventListener(ev, eat, { passive: false });
  }
  document.addEventListener('gesturestart', eat, { passive: false });
  document.addEventListener('dblclick',     eat, { passive: false });

  return st;
};
/* ==========================================================================
   7. RENDERING -- wood under neon
   --------------------------------------------------------------------------
   Canvas 2D, top-down, two baked layers and one live one.

     woodTex     the board's maple, generated pixel by pixel once. Procedural
                 grain: turbulent growth rings plus fine fibre streaks, in a
                 fixed 1024x1024 texture that is then drawn scaled. Grain is
                 low frequency, so a fixed texture upscaled to any iPad is
                 indistinguishable from one baked at device resolution and
                 costs a fraction as much.

     boardLayer  woodTex plus everything static drawn as vectors at full
                 device resolution: the ditch, the scoring rings, the
                 quadrant lines, the 20 hole, the eight pegs and their glow.
                 Rebaked only on resize or rotation. This is where the
                 expensive shadowBlur glow work happens -- once, not 60
                 times a second.

     live        per frame: blit boardLayer, then the discs, the trajectory
                 preview and the aiming furniture.

   THE GLOW BUDGET
     shadowBlur is the obvious way to get neon and it is far too slow to use
     per frame on an iPad -- it forces a full-surface blur every call. So it
     is used only in the bake. Live glow is layered strokes: the same shape
     drawn 3-4 times, widest and faintest first, tightest and brightest
     last, with globalCompositeOperation 'lighter' so overlapping light
     adds the way light does. That reads as neon and costs almost nothing.
   ========================================================================== */

const RENDER = {};
CROK.RENDER = RENDER;

/* --- deterministic value noise ------------------------------------------ */
/* No Math.random: the same board grain every time the file is opened. */
function hash2(x, y, seed){
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(seed | 0, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const smooth = t => t * t * (3 - 2 * t);
function vnoise(x, y, seed){
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = smooth(xf), v = smooth(yf);
  const a = hash2(xi,     yi,     seed), b = hash2(xi + 1, yi,     seed);
  const c = hash2(xi,     yi + 1, seed), d = hash2(xi + 1, yi + 1, seed);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, y, seed, oct, lac, gain){
  let s = 0, amp = 1, norm = 0, fx = x, fy = y;
  for (let i = 0; i < oct; i++){
    s += amp * vnoise(fx, fy, seed + i * 101);
    norm += amp; amp *= gain; fx *= lac; fy *= lac;
  }
  return s / norm;
}
RENDER.fbm = fbm;

/* --- the maple ---------------------------------------------------------- */
RENDER.bakeWood = function(size){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const img = g.createImageData(size, size);
  const px = img.data;

  /* two maple tones and the dark of the late-growth line */
  const A = [214, 174, 124];    /* pale early wood                        */
  const B = [178, 132,  80];    /* warmer late wood                       */
  const C = [126,  86,  46];    /* the grain line itself                  */

  const inv = 1 / size;
  for (let y = 0; y < size; y++){
    const fy = y * inv;
    for (let x = 0; x < size; x++){
      const fx = x * inv;

      /* growth rings: a stretched distance field, warped by turbulence, run
         through a sine. Stretching y by 9 makes the rings into long
         near-parallel bands -- flat-sawn board rather than an end grain
         cross-section. */
      const turb = fbm(fx * 3.1, fy * 3.1, 7, 4, 2.03, 0.52) - 0.5;
      const band = Math.sin((fx * 26 + fy * 2.2 + turb * 5.4) * Math.PI);
      /* sharpen: real grain lines are thin and dark, not sinusoidal */
      let ring = Math.pow(Math.abs(band), 0.42);

      /* fine fibre: high frequency, heavily stretched along the grain */
      const fibre = fbm(fx * 190, fy * 11, 23, 2, 2.1, 0.5);

      /* a few wider figure sweeps so it does not read as wallpaper */
      const figure = fbm(fx * 1.4, fy * 0.7, 41, 3, 2.0, 0.6);

      let t = clamp(ring * 0.72 + figure * 0.3, 0, 1);
      const dark = clamp((1 - ring) * 1.25 - 0.34, 0, 1);

      let r = lerp(A[0], B[0], t), gg = lerp(A[1], B[1], t), b = lerp(A[2], B[2], t);
      r = lerp(r, C[0], dark * 0.85); gg = lerp(gg, C[1], dark * 0.85); b = lerp(b, C[2], dark * 0.85);

      const f = (fibre - 0.5) * 15;
      const i4 = (y * size + x) * 4;
      px[i4]     = clamp(r  + f, 0, 255);
      px[i4 + 1] = clamp(gg + f, 0, 255);
      px[i4 + 2] = clamp(b  + f * 0.8, 0, 255);
      px[i4 + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c;
};

/* --- layered-stroke glow ------------------------------------------------ */
/* draw(ctx) is called once per pass; the pass gets progressively tighter
   and brighter. This is the per-frame neon primitive. */
function glowStroke(g, draw, colour, width, spread, alpha){
  const prev = g.globalCompositeOperation;
  g.globalCompositeOperation = 'lighter';
  const passes = [[spread, alpha * 0.13], [spread * 0.55, alpha * 0.2],
                  [spread * 0.26, alpha * 0.3], [1, alpha]];
  for (const [mul, a] of passes){
    g.strokeStyle = colour;
    g.globalAlpha = a;
    g.lineWidth = width * mul;
    g.beginPath(); draw(g); g.stroke();
  }
  g.globalAlpha = 1;
  g.globalCompositeOperation = prev;
}
RENDER.glowStroke = glowStroke;

function glowFill(g, draw, colour, spread, alpha){
  const prev = g.globalCompositeOperation;
  g.globalCompositeOperation = 'lighter';
  for (const [mul, a] of [[spread, alpha * 0.16], [spread * 0.5, alpha * 0.26], [0, alpha]]){
    g.fillStyle = colour; g.globalAlpha = a;
    g.beginPath(); draw(g, mul); g.fill();
  }
  g.globalAlpha = 1;
  g.globalCompositeOperation = prev;
}
RENDER.glowFill = glowFill;
/* ==========================================================================
   7b. THE BOARD LAYER -- baked once
   ========================================================================== */

RENDER.newView = function(){
  return { cx: 0, cy: 0, scale: 1, rot: 0, w: 0, h: 0, dpr: 1,
           board: null, wood: null, builtFor: '' };
};

/* board metres -> canvas pixels, with the view rotation applied */
RENDER.toScreen = function(v, x, y){
  const c = Math.cos(v.rot), s = Math.sin(v.rot);
  return { x: v.cx + (x * c - y * s) * v.scale,
           y: v.cy + (x * s + y * c) * v.scale };
};
/* and back, for turning a finger into a board position */
RENDER.toBoard = function(v, sx, sy){
  const dx = (sx - v.cx) / v.scale, dy = (sy - v.cy) / v.scale;
  const c = Math.cos(-v.rot), s = Math.sin(-v.rot);
  return { x: dx * c - dy * s, y: dx * s + dy * c };
};

RENDER.layout = function(v, geo, wCss, hCss, dpr, rot){
  const P = geo.P;
  v.w = wCss; v.h = hCss; v.dpr = dpr; v.rot = rot;
  /* Fit the whole board -- surface, ditch and rail -- into the smaller of
     the two screen dimensions, with only a thin margin. The board is the
     thing you are looking at and aiming on, so it gets the screen: the
     score cards and the round counter live in the corners a circle leaves
     empty, and the prompt sits over the dark ditch where it still reads. */
  const outer = P.R_SURFACE + P.DITCH_W + P.RAIL_W;
  const pad = Math.min(wCss, hCss) * 0.018 + 6;
  v.scale = (Math.min(wCss, hCss) / 2 - pad) / outer;
  v.cx = wCss / 2;
  v.cy = hCss / 2;
  return v;
};

RENDER.bakeBoard = function(v, geo){
  const P = geo.P;
  const key = `${Math.round(v.w)}x${Math.round(v.h)}@${v.dpr.toFixed(2)}`;
  if (v.board && v.builtFor === key) return v.board;

  if (!v.wood) v.wood = RENDER.bakeWood(1024);

  const c = document.createElement('canvas');
  c.width  = Math.max(1, Math.round(v.w * v.dpr));
  c.height = Math.max(1, Math.round(v.h * v.dpr));
  const g = c.getContext('2d');
  g.scale(v.dpr, v.dpr);

  const S = v.scale;
  const px = m => m * S;                      /* metres -> css px          */
  const cx = v.cx, cy = v.cy;
  const rSurf = px(P.R_SURFACE);
  const rDitch = px(P.R_SURFACE + P.DITCH_W);
  const rRail = px(P.R_SURFACE + P.DITCH_W + P.RAIL_W);

  /* --- the rail: a dark ring with a thin neon edge --------------------- */
  const railGrad = g.createRadialGradient(cx, cy, rDitch, cx, cy, rRail);
  railGrad.addColorStop(0, '#15151f');
  railGrad.addColorStop(1, '#05050a');
  g.fillStyle = railGrad;
  g.beginPath(); g.arc(cx, cy, rRail, 0, TAU); g.fill();

  g.save();
  g.shadowColor = 'rgba(34,224,255,0.85)'; g.shadowBlur = px(0.012);
  g.strokeStyle = 'rgba(34,224,255,0.5)'; g.lineWidth = Math.max(1, px(0.0016));
  g.beginPath(); g.arc(cx, cy, rRail - g.lineWidth / 2, 0, TAU); g.stroke();
  g.restore();

  /* --- the ditch: the surface stands half an inch above it, so it reads
         as a recess. Darkest at the inner wall. ------------------------- */
  const dg = g.createRadialGradient(cx, cy, rSurf * 0.985, cx, cy, rDitch);
  dg.addColorStop(0,   '#000000');
  dg.addColorStop(0.35,'#0d0a08');
  dg.addColorStop(1,   '#241a12');
  g.fillStyle = dg;
  g.beginPath(); g.arc(cx, cy, rDitch, 0, TAU); g.fill();

  /* --- the playing surface: maple ------------------------------------- */
  g.save();
  g.beginPath(); g.arc(cx, cy, rSurf, 0, TAU); g.clip();
  const wsz = rSurf * 2;
  g.drawImage(v.wood, cx - rSurf, cy - rSurf, wsz, wsz);

  /* polished sheen -- one broad highlight from the upper left, which is
     what makes a flat fill read as lacquered wood rather than paper */
  const sheen = g.createLinearGradient(cx - rSurf, cy - rSurf, cx + rSurf * 0.7, cy + rSurf);
  sheen.addColorStop(0,    'rgba(255,248,225,0.30)');
  sheen.addColorStop(0.38, 'rgba(255,240,205,0.06)');
  sheen.addColorStop(0.72, 'rgba(60,35,10,0.13)');
  sheen.addColorStop(1,    'rgba(30,16,4,0.30)');
  g.fillStyle = sheen;
  g.fillRect(cx - rSurf, cy - rSurf, wsz, wsz);

  /* a cool neon spill across the wood, so the board belongs to the same
     room as the glow. Very low alpha: the wood has to stay wood. */
  const spill = g.createRadialGradient(cx, cy, 0, cx, cy, rSurf);
  spill.addColorStop(0,   'rgba(255,43,143,0.13)');
  spill.addColorStop(0.5, 'rgba(80,40,120,0.05)');
  spill.addColorStop(1,   'rgba(34,224,255,0.10)');
  g.fillStyle = spill;
  g.fillRect(cx - rSurf, cy - rSurf, wsz, wsz);

  /* edge shading: the surface darkens into its own rim */
  const vig = g.createRadialGradient(cx, cy, rSurf * 0.72, cx, cy, rSurf);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.42)');
  g.fillStyle = vig;
  g.fillRect(cx - rSurf, cy - rSurf, wsz, wsz);
  g.restore();

  /* --- the scoring lines ---------------------------------------------- */
  /* Real boards draw these about 1/16 inch wide, and NCA Rule 6e scores by
     whether the disc's bottom edge is over any part of the line -- so the
     line's WIDTH is not decoration, it is part of the scoring geometry.
     Drawn at true width for that reason. */
  const lw = Math.max(1, px(P.LINE_W));
  const ring = (r, colour, glowPx, alpha) => {
    g.save();
    g.shadowColor = colour; g.shadowBlur = glowPx;
    g.strokeStyle = colour; g.globalAlpha = alpha; g.lineWidth = lw;
    g.beginPath(); g.arc(cx, cy, px(r), 0, TAU); g.stroke();
    /* a second, tighter pass gives the line a hot core */
    g.shadowBlur = glowPx * 0.35; g.globalAlpha = Math.min(1, alpha * 1.35);
    g.lineWidth = Math.max(1, lw * 0.5);
    g.beginPath(); g.arc(cx, cy, px(r), 0, TAU); g.stroke();
    g.restore();
  };
  ring(P.R_OUT, '#ffb020', px(0.020), 0.80);   /* shooting line = out line */
  ring(P.R_10,  '#22e0ff', px(0.016), 0.72);
  ring(P.R_15,  '#ff2b8f', px(0.020), 0.88);

  /* --- the quadrant lines --------------------------------------------- */
  /* They only span the 5-point band, from the 10 circle out to the
     shooting line. They do not continue in across the 10 and 15 regions --
     drawing them all the way to the middle is the commonest mistake in
     pictures of crokinole boards. */
  g.save();
  g.strokeStyle = 'rgba(255,176,32,0.55)';
  g.shadowColor = 'rgba(255,176,32,0.7)'; g.shadowBlur = px(0.010);
  g.lineWidth = lw;
  for (let i = 0; i < 4; i++){
    const a = P.QUAD_PHASE + i * (Math.PI / 2);
    const ca = Math.cos(a), sa = Math.sin(a);
    /* rotate the line into view space */
    const p0 = RENDER.toScreen(v, P.R_10 * ca, P.R_10 * sa);
    const p1 = RENDER.toScreen(v, P.R_OUT * ca, P.R_OUT * sa);
    g.beginPath(); g.moveTo(p0.x, p0.y); g.lineTo(p1.x, p1.y); g.stroke();
  }
  g.restore();

  /* --- the 20 hole ---------------------------------------------------- */
  const rh = px(P.R_HOLE);
  /* the recess: dark, with a lit far wall so it reads as 6 mm deep */
  const hg = g.createRadialGradient(cx - rh * 0.25, cy - rh * 0.25, rh * 0.05, cx, cy, rh);
  hg.addColorStop(0,   '#000000');
  hg.addColorStop(0.72,'#0a0206');
  hg.addColorStop(1,   '#3a1020');
  g.fillStyle = hg;
  g.beginPath(); g.arc(cx, cy, rh, 0, TAU); g.fill();
  /* the lip, glowing -- this is the thing you are aiming at, so it is the
     brightest object on the board */
  g.save();
  g.shadowColor = '#ff2b8f'; g.shadowBlur = px(0.030);
  g.strokeStyle = '#ff5fa8'; g.lineWidth = Math.max(1, px(0.0013));
  g.beginPath(); g.arc(cx, cy, rh, 0, TAU); g.stroke();
  g.shadowBlur = px(0.012); g.strokeStyle = '#ffd0e6';
  g.beginPath(); g.arc(cx, cy, rh * 0.99, 0, TAU); g.stroke();
  g.restore();

  /* --- the eight pegs ------------------------------------------------- */
  /* Brass screws in black rubber sleeves, 3/8 inch across, standing half an
     inch proud. Drawn as a lit post with a cast shadow so the height reads
     from directly above: a flat dot looks painted on. */
  const rp = px(P.R_PEG);
  for (const pg of geo.pegs){
    const s = RENDER.toScreen(v, pg.x, pg.y);
    /* shadow, thrown away from the light at the upper left */
    g.save();
    g.globalAlpha = 0.5; g.fillStyle = '#000';
    g.beginPath(); g.ellipse(s.x + rp * 0.75, s.y + rp * 0.95, rp * 1.15, rp * 0.8,
                             0, 0, TAU); g.fill();
    g.restore();
    /* the rubber sleeve */
    const pgr = g.createRadialGradient(s.x - rp * 0.4, s.y - rp * 0.45, rp * 0.1, s.x, s.y, rp);
    pgr.addColorStop(0, '#4a4a58');
    pgr.addColorStop(0.55, '#1b1b24');
    pgr.addColorStop(1, '#0a0a10');
    g.fillStyle = pgr;
    g.beginPath(); g.arc(s.x, s.y, rp, 0, TAU); g.fill();
    /* neon ring so it belongs to the board's palette, plus a brass glint */
    g.save();
    g.shadowColor = '#22e0ff'; g.shadowBlur = px(0.012);
    g.strokeStyle = 'rgba(34,224,255,0.9)'; g.lineWidth = Math.max(1, rp * 0.28);
    g.beginPath(); g.arc(s.x, s.y, rp * 0.86, 0, TAU); g.stroke();
    g.restore();
    g.fillStyle = 'rgba(255,214,140,0.85)';
    g.beginPath(); g.arc(s.x - rp * 0.28, s.y - rp * 0.3, rp * 0.24, 0, TAU); g.fill();
  }

  v.board = c; v.builtFor = key;
  return c;
};
/* ==========================================================================
   7c. THE LIVE LAYER -- per frame
   ========================================================================== */

RENDER.DISC_COLOUR = [
  { body: '#c8203c', hi: '#ff7d92', rim: '#ff3355', glow: 'rgba(255,51,85,'  },
  { body: '#0c6ea8', hi: '#8fdcff', rim: '#22b8ff', glow: 'rgba(34,184,255,' },
];

/* one disc, drawn from above: a thick wooden puck with a lit rim.
   The notch is not decoration -- it is how you see the disc spinning, and
   the spin is real physics that would otherwise be invisible. */
RENDER.disc = function(g, v, d, opts){
  const P = opts.geo.P;
  const s = RENDER.toScreen(v, d.x, d.y);
  const r = P.R_DISC * v.scale;
  const col = RENDER.DISC_COLOUR[d.owner];
  const a = d.a + v.rot;
  const dim = opts.dim ? 0.42 : 1;

  /* the shadow it casts: the disc stands 10 mm off the surface */
  g.save();
  g.globalAlpha = 0.42 * dim; g.fillStyle = '#000';
  g.beginPath(); g.ellipse(s.x + r * 0.16, s.y + r * 0.2, r * 1.02, r * 0.98, 0, 0, TAU);
  g.fill();
  g.restore();

  /* the halo */
  g.save();
  g.globalCompositeOperation = 'lighter';
  const hg = g.createRadialGradient(s.x, s.y, r * 0.8, s.x, s.y, r * 2.3);
  hg.addColorStop(0, col.glow + (0.34 * dim) + ')');
  hg.addColorStop(1, col.glow + '0)');
  g.fillStyle = hg;
  g.beginPath(); g.arc(s.x, s.y, r * 2.3, 0, TAU); g.fill();
  g.restore();

  /* the body */
  g.save();
  g.globalAlpha = dim;
  const bg = g.createRadialGradient(s.x - r * 0.38, s.y - r * 0.42, r * 0.08, s.x, s.y, r);
  bg.addColorStop(0, col.hi);
  bg.addColorStop(0.42, col.body);
  bg.addColorStop(1, '#12060a');
  g.fillStyle = bg;
  g.beginPath(); g.arc(s.x, s.y, r, 0, TAU); g.fill();

  /* the lit rim */
  g.strokeStyle = col.rim; g.lineWidth = Math.max(1, r * 0.15);
  g.globalAlpha = 0.95 * dim;
  g.beginPath(); g.arc(s.x, s.y, r * 0.92, 0, TAU); g.stroke();

  /* the grain notch, which turns with the disc */
  g.globalAlpha = 0.55 * dim;
  g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineWidth = Math.max(1, r * 0.11);
  g.beginPath();
  g.moveTo(s.x + Math.cos(a) * r * 0.24, s.y + Math.sin(a) * r * 0.24);
  g.lineTo(s.x + Math.cos(a) * r * 0.70, s.y + Math.sin(a) * r * 0.70);
  g.stroke();
  /* the dished centre every crokinole disc has */
  g.globalAlpha = 0.35 * dim;
  g.fillStyle = 'rgba(0,0,0,0.5)';
  g.beginPath(); g.arc(s.x, s.y, r * 0.17, 0, TAU); g.fill();
  g.restore();
};

/* a hollow outline: where a disc is predicted to finish up */
RENDER.ghost = function(g, v, x, y, owner, geo, alpha){
  const s = RENDER.toScreen(v, x, y);
  const r = geo.P.R_DISC * v.scale;
  const col = RENDER.DISC_COLOUR[owner];
  g.save();
  g.setLineDash([r * 0.5, r * 0.42]);
  g.strokeStyle = col.rim; g.globalAlpha = alpha; g.lineWidth = Math.max(1, r * 0.13);
  g.beginPath(); g.arc(s.x, s.y, r * 0.94, 0, TAU); g.stroke();
  g.restore();
};

/* ==========================================================================
   7d. THE AIM -- the trajectory preview
   --------------------------------------------------------------------------
   This is not an estimate and it is not a straight line with a bounce
   guessed on the end. It is the ACTUAL shot, simulated to rest by the same
   solver that will run when the finger lifts, and drawn. The markers sit on
   real contact events with real impulses. If the preview says the disc will
   clip the second peg and settle on the 15 line, that is what will happen,
   because the same numbers produced both.
   ========================================================================== */

RENDER.preview = function(g, v, geo, pv, mode){
  if (!pv || !pv.path || pv.path.length < 4) return;
  const P = geo.P;
  const pts = pv.path;

  /* how much of the path to show */
  let stop = pts.length / 2;
  if (mode === 'short'){
    /* up to and a little past the first contact with anything */
    const first = pv.events.find(e => e.kind === 'disc' || e.kind === 'peg');
    if (first){
      /* find the sample nearest that event's position */
      let best = stop, bd = Infinity;
      for (let i = 0; i < pts.length / 2; i++){
        const d = hypot(pts[i * 2] - first.x, pts[i * 2 + 1] - first.y);
        if (d < bd){ bd = d; best = i; }
      }
      stop = Math.min(pts.length / 2, best + 3);
    }
  }

  /* the line: bright core over a wide soft halo, additive */
  const draw = ctx => {
    let started = false;
    for (let i = 0; i < stop; i++){
      const s = RENDER.toScreen(v, pts[i * 2], pts[i * 2 + 1]);
      if (!started){ ctx.moveTo(s.x, s.y); started = true; }
      else ctx.lineTo(s.x, s.y);
    }
  };
  g.lineCap = 'round'; g.lineJoin = 'round';
  RENDER.glowStroke(g, draw, '#7cff4d', Math.max(1.2, P.R_DISC * v.scale * 0.20), 6, 0.8);

  /* The corridor the disc's BODY will sweep. This is the one piece of the
     preview that is not just decoration on the centre line: it is the disc
     that has to fit between two pegs, not the line through its middle, and
     seeing the whole width is how you know whether it will. Drawn as two
     hairlines at the edges rather than a filled band, which says the same
     thing without burying the board under a bar of light. */
  g.save();
  g.globalAlpha = 0.20; g.strokeStyle = '#7cff4d';
  g.lineWidth = Math.max(1, v.scale * 0.0009);
  g.setLineDash([v.scale * 0.012, v.scale * 0.010]);
  for (const side of [-1, 1]){
    g.beginPath();
    let started = false;
    for (let i = 0; i < stop; i++){
      const x = pts[i * 2], y = pts[i * 2 + 1];
      /* offset perpendicular to the local direction of travel */
      const j = Math.min(stop - 1, i + 1), k = Math.max(0, i - 1);
      let dx = pts[j * 2] - pts[k * 2], dy = pts[j * 2 + 1] - pts[k * 2 + 1];
      const L = Math.sqrt(dx * dx + dy * dy) || 1;
      const s2 = RENDER.toScreen(v, x - (dy / L) * P.R_DISC * side,
                                    y + (dx / L) * P.R_DISC * side);
      if (!started){ g.moveTo(s2.x, s2.y); started = true; } else g.lineTo(s2.x, s2.y);
    }
    g.stroke();
  }
  g.restore();

  /* contact markers, sized by how hard the contact is */
  for (const e of pv.events){
    if (e.kind !== 'disc' && e.kind !== 'peg') continue;
    const s = RENDER.toScreen(v, e.x, e.y);
    const mag = clamp(e.impulse / (P.M_DISC * P.V_MAX_SHOT), 0, 1);
    const rr = (P.R_DISC * v.scale) * (0.3 + 0.42 * mag);
    RENDER.glowFill(g, (ctx, mul) => {
      ctx.arc(s.x, s.y, rr * (1 + mul * 0.5), 0, TAU);
    }, e.kind === 'peg' ? '#22e0ff' : '#ffb020', 2.0, 0.7);
  }

  /* where everything ends up */
  if (mode === 'full'){
    for (const d of pv.world.discs){
      if (d.fate === 'hole'){
        RENDER.ghost(g, v, 0, 0, d.owner, geo, 0.95);
      } else if (d.live && !geo.deadAtRest(d.x, d.y)){
        RENDER.ghost(g, v, d.x, d.y, d.owner, geo, d.shooter ? 0.9 : 0.55);
      }
    }
  }
};

/* the flick vector and how much power is on it */
RENDER.aimVector = function(g, v, geo, disc, aim, power){
  const P = geo.P;
  const o = RENDER.toScreen(v, disc.x, disc.y);
  const t = RENDER.toScreen(v, aim.x, aim.y);
  let dx = t.x - o.x, dy = t.y - o.y;
  const L = hypot(dx, dy) || 1;
  dx /= L; dy /= L;
  const r = P.R_DISC * v.scale;

  /* the shaft, from the disc's edge outwards, length showing power */
  const len = r * 1.6 + (r * 5.5) * power;
  const ax = o.x + dx * r * 1.15, ay = o.y + dy * r * 1.15;
  const bx = o.x + dx * len,      by = o.y + dy * len;
  const hot = power > 0.86;
  const col = hot ? '#ff2b8f' : power > 0.55 ? '#ffb020' : '#7cff4d';

  RENDER.glowStroke(g, ctx => { ctx.moveTo(ax, ay); ctx.lineTo(bx, by); },
                    col, Math.max(2, r * 0.34), 6, 0.95);
  /* the head */
  const hl = r * 0.85, hw = r * 0.5;
  RENDER.glowFill(g, (ctx, mul) => {
    ctx.moveTo(bx + dx * hl, by + dy * hl);
    ctx.lineTo(bx - dy * hw - dx * mul, by + dx * hw - dy * mul);
    ctx.lineTo(bx + dy * hw - dx * mul, by - dx * hw - dy * mul);
    ctx.closePath();
  }, col, 1.6, 0.95);

  /* the power arc around the disc: a dial you can read without looking away
     from where you are aiming */
  g.save();
  g.lineCap = 'round';
  g.strokeStyle = 'rgba(255,255,255,0.13)'; g.lineWidth = Math.max(2, r * 0.26);
  g.beginPath(); g.arc(o.x, o.y, r * 1.75, -Math.PI * 1.25, Math.PI * 0.25); g.stroke();
  g.restore();
  RENDER.glowStroke(g, ctx => {
    ctx.arc(o.x, o.y, r * 1.75, -Math.PI * 1.25, -Math.PI * 1.25 + Math.PI * 1.5 * power);
  }, col, Math.max(2, r * 0.26), 4, 0.9);
};

/* the arc the shooter may place on, so a player never has to guess */
RENDER.placementArc = function(g, v, geo, owner, live){
  const pl = geo.placement(owner);
  const P = geo.P;
  const col = RENDER.DISC_COLOUR[owner].rim;
  const steps = 40;
  const draw = ctx => {
    for (let i = 0; i <= steps; i++){
      const a = pl.a0 + (pl.a1 - pl.a0) * (i / steps);
      const s = RENDER.toScreen(v, pl.r * Math.cos(a), pl.r * Math.sin(a));
      if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y);
    }
  };
  if (live){
    RENDER.glowStroke(g, draw, col, Math.max(1.5, P.R_DISC * v.scale * 0.22), 5, 0.75);
  } else {
    /* the opponent's line is drawn flat, not with the additive glow: four
       'lighter' passes at low alpha still stack up to near-white, which
       made the waiting player's arc the brightest thing on the board */
    g.save();
    g.strokeStyle = col; g.globalAlpha = 0.30;
    g.lineWidth = Math.max(1, P.R_DISC * v.scale * 0.14);
    g.beginPath(); draw(g); g.stroke();
    g.restore();
  }
};

/* ==========================================================================
   7e. THE FRAME
   ========================================================================== */

RENDER.frame = function(g, v, geo, st){
  if (st.clock === undefined) st.clock = 0;
  g.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);
  g.clearRect(0, 0, v.w, v.h);
  const board = RENDER.bakeBoard(v, geo);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(board, 0, 0);
  g.setTransform(v.dpr, 0, 0, v.dpr, 0, 0);

  /* the shooter's own line, lit; the opponent's, dim */
  if (st.showArcs){
    RENDER.placementArc(g, v, geo, 1 - st.shooter, false);
    RENDER.placementArc(g, v, geo, st.shooter, true);
  }

  if (st.preview) RENDER.preview(g, v, geo, st.preview, st.previewMode);

  /* discs, opponent's first so yours read on top when they overlap */
  const ds = st.world.discs;
  for (const d of ds) if (d.live && d.owner !== st.shooter) RENDER.disc(g, v, d, { geo });
  for (const d of ds) if (d.live && d.owner === st.shooter) RENDER.disc(g, v, d, { geo });
  if (st.pending) RENDER.disc(g, v, st.pending, { geo });

  /* The disc being aimed reads as live, and on a trackpad a second ring
     closes around it as the stop-to-shoot moment passes -- so the wait is
     something you can watch rather than be surprised by, and moving again
     visibly calls it off. */
  if (st.aiming && st.pending){
    const p = RENDER.toScreen(v, st.pending.x, st.pending.y);
    const r = geo.P.R_DISC * v.scale;
    RENDER.glowStroke(g, ctx => { ctx.arc(p.x, p.y, r * 1.5, 0, TAU); },
                      RENDER.DISC_COLOUR[st.shooter].rim,
                      Math.max(1.5, r * 0.14), 5, 0.7);
    if (st.settle > 0){
      RENDER.glowStroke(g, ctx => {
        ctx.arc(p.x, p.y, r * (2.3 - 0.8 * st.settle), -Math.PI / 2,
                -Math.PI / 2 + TAU * st.settle);
      }, '#7cff4d', Math.max(2, r * 0.2), 6, 0.95);
    }
  }

  if (st.aim && st.pending){
    RENDER.aimVector(g, v, geo, st.pending, st.aim, st.power);
  }
};
/* ==========================================================================
   8. THE OPPONENT
   --------------------------------------------------------------------------
   The AI plays the same game you do. It cannot nudge a disc, it does not
   know where yours will stop, and it has no numbers you do not have: it
   picks a placement, an aim and a power, and hands those three numbers to
   the same solver your flick goes through.

   HOW IT THINKS
     1. Propose candidate shots. Mostly AIMED ones -- at each opponent disc,
        at the 20, at a gap in the pegs, at its own discs for a combination
        -- because sweeping angles blindly wastes almost every sample on
        shots no player would consider. A coarse blind sweep is added on top
        so bank shots off the pegs are still discovered.
     2. Simulate each one to rest. This is the expensive part and it is why
        candidates are proposed rather than enumerated.
     3. Score the board that results, from its own side.
     4. Pick, then MISS. Difficulty is not a worse choice of shot, it is a
        worse execution of a good one: the chosen aim and power are
        perturbed by Gaussian error before the shot is actually taken. That
        is how human error is shaped, and it is why an easy opponent still
        looks like it is trying to do something sensible and simply keeps
        catching the peg.

   WHY NOT LOOK AHEAD
     A reply search would multiply the cost by the number of opponent
     candidates and buy less than it looks: what actually matters after your
     shot is not one specific reply but whether what you left is EXPOSED.
     That is measured directly instead -- for each of its discs, is there a
     clear straight line from anywhere on the opponent's shooting arc? A
     disc tucked behind a peg scores as safe, a disc sitting in the open
     scores as a liability. It costs a few ray tests instead of a few
     hundred simulations, and it is the thing a strong player is actually
     looking at.
   ========================================================================== */

const AI = {};
CROK.AI = AI;

/* aimSd/powSd are the HANDS: how far a shot strays from what was intended.
   Everything else is the HEAD: how many shots are considered, how finely,
   and -- the part that matters most -- whether the player thinks about
   whether they can actually execute the shot they have picked.

   robustN is that last one. A shot is re-scored by simulating it a few
   times WITH the player's own shake applied, and taking the average. It is
   the difference between "this line scores 20 if struck perfectly" and
   "this line scores well even the way I hit it", which is what a good
   player is really choosing between. Easy does not do it at all -- a
   beginner picks a shot that looks right and finds out afterwards. */
AI.LEVELS = {
  /* Easy is calibrated against published human numbers rather than a
     number somebody liked: it scores an open 20 about 30% of the time,
     inside the 20-50% band reported for recreational players, and gets a
     legal shot away about 6 times in 10. */
  easy:   { aimSd: 0.032, powSd: 0.16,  placements: 3, powers: 4, sweep: 0,  targetJitter: 1,
            refine: 0, pickTop: 5, robustK: 0, robustN: 0, label: 'Easy' },
  medium: { aimSd: 0.016, powSd: 0.095, placements: 5, powers: 4, sweep: 24, targetJitter: 3,
            refine: 1, pickTop: 2, robustK: 5, robustN: 4, label: 'Medium' },
  hard:   { aimSd: 0.005, powSd: 0.032, placements: 7, powers: 5, sweep: 48, targetJitter: 5,
            refine: 2, pickTop: 1, robustK: 6, robustN: 6, label: 'Hard' },
};

/* --- how exposed is a disc? -------------------------------------------- */
/* Can the opponent see it in a straight line from anywhere they are allowed
   to shoot from? Sample their placement arc and ray-test against the pegs
   and every other disc. This is the peg-hiding game, measured. */
AI.exposure = function(geo, world, target, byOwner){
  const P = geo.P;
  const pl = geo.placement(byOwner);
  const N = 11;
  let clear = 0;
  for (let i = 0; i < N; i++){
    const a = pl.a0 + (pl.a1 - pl.a0) * (i / (N - 1));
    const sx = pl.r * Math.cos(a), sy = pl.r * Math.sin(a);
    let dx = target.x - sx, dy = target.y - sy;
    const L = hypot(dx, dy);
    if (L < 1e-9) continue;
    dx /= L; dy /= L;
    let blocked = false;
    /* a shooter of radius R passing an obstacle of radius Ro needs the
       obstacle's centre further than R+Ro from the line */
    for (const pg of geo.pegs){
      const t = (pg.x - sx) * dx + (pg.y - sy) * dy;
      if (t <= 0 || t >= L) continue;
      const px = sx + dx * t - pg.x, py = sy + dy * t - pg.y;
      if (hypot(px, py) < P.R_DISC + P.R_PEG){ blocked = true; break; }
    }
    if (!blocked){
      for (const d of world.discs){
        if (!d.live || d === target) continue;
        const t = (d.x - sx) * dx + (d.y - sy) * dy;
        if (t <= 0 || t >= L - P.R_DISC) continue;
        const qx = sx + dx * t - d.x, qy = sy + dy * t - d.y;
        if (hypot(qx, qy) < 2 * P.R_DISC){ blocked = true; break; }
      }
    }
    if (!blocked) clear++;
  }
  return clear / N;
};

/* ==========================================================================
   8a. WHAT A BOARD IS WORTH
   --------------------------------------------------------------------------
   From `me`'s point of view, in units of disc points so the weights stay
   legible. The strategy in here is the strategy strong players describe:
   a 20 is worth chasing because it is banked and can never be taken away;
   a 15 behind a peg is the next best thing; a disc parked in the open is
   points you are lending the opponent; and having ANY disc on the board is
   worth something on its own, because it forces the opponent to hit one
   instead of taking a free shot at the 20.
   ========================================================================== */

AI.W = {
  twenty:     6,    /* on top of the 20 points -- it is safe forever       */
  guarded:    3.0,  /* per own disc that the opponent cannot see           */
  exposed:    2.2,  /* per own scoring disc sitting in the open            */
  removeOpp:  4.0,  /* per opponent disc sent off the board                */
  loseOwn:    3.0,  /* per own disc sent off the board                     */
  onBoard:    2.5,  /* having something out there constrains their shot    */
  foul:       220,  /* never worth it                                      */
};

AI.evaluate = function(geo, before, result, me, banked){
  const W = AI.W;
  const you = 1 - me;
  const w = result.world;
  let s = 0;

  /* raw points, mine minus theirs */
  let mine = 0, theirs = 0, myLive = 0, twenties = 0;
  for (const d of w.discs){
    if (d.fate === 'hole' && !d.voided20){
      if (d.owner === me){ mine += 20; twenties++; } else theirs += 20;
      continue;
    }
    if (!d.live) continue;
    /* a disc at rest touching the shooting line is out of play -- score the
       board the way RULES.endTurn will leave it, not the way it looks now */
    if (geo.deadAtRest(d.x, d.y)) continue;
    const z = geo.zoneOf(d.x, d.y);
    if (d.owner === me){ mine += z; myLive++; } else theirs += z;
  }
  s += mine - theirs;
  s += twenties * W.twenty;

  /* how much did this shot change the disc count on each side? */
  let oppBefore = 0, myBefore = 0;
  for (const d of before.discs){
    if (!d.live) continue;
    if (d.owner === me) myBefore++; else oppBefore++;
  }
  let oppAfter = 0, myAfter = 0;
  for (const d of w.discs){
    if (!d.live || geo.deadAtRest(d.x, d.y)) continue;
    if (d.owner === me) myAfter++; else oppAfter++;
  }
  s += Math.max(0, oppBefore - oppAfter) * W.removeOpp;
  /* the shooter itself is a new disc, so count losses against what should
     be there rather than against the raw before-count */
  s -= Math.max(0, (myBefore + 1) - myAfter) * W.loseOwn;
  if (myAfter > 0) s += W.onBoard;

  /* safety of what I have left */
  for (const d of w.discs){
    if (!d.live || d.owner !== me || geo.deadAtRest(d.x, d.y)) continue;
    const z = geo.zoneOf(d.x, d.y);
    const ex = AI.exposure(geo, w, d, you);
    s += (1 - ex) * W.guarded;
    s -= ex * W.exposed * (z / 10);
  }
  return s;
};

/* ==========================================================================
   8b. PROPOSING SHOTS
   ========================================================================== */

AI.candidates = function(geo, world, me, lvl, rng){
  const P = geo.P;
  const pl = geo.placement(me);
  const out = [];

  /* placements: spread across the legal arc */
  const places = [];
  for (let i = 0; i < lvl.placements; i++){
    const f = lvl.placements === 1 ? 0.5 : i / (lvl.placements - 1);
    const a = pl.a0 + (pl.a1 - pl.a0) * f;
    places.push(geo.freePlacement(me, pl.r * Math.cos(a), pl.r * Math.sin(a), world.discs));
  }

  /* things worth aiming at */
  const targets = [{ x: 0, y: 0, kind: 'twenty' }];
  for (const d of world.discs){
    if (!d.live) continue;
    targets.push({ x: d.x, y: d.y, kind: d.owner === me ? 'own' : 'opp' });
  }
  /* a spot inside the 15 ring on each side of the quadrant, for a safe
     guarded landing when there is nothing to hit */
  const cq = geo.quadCentre(me);
  for (const off of [-0.30, 0, 0.30]){
    const a = cq + off + Math.PI;      /* the far side of the middle        */
    targets.push({ x: P.R_15 * 0.55 * Math.cos(a), y: P.R_15 * 0.55 * Math.sin(a), kind: 'park' });
  }

  /* THE POWER GRID IS GEOMETRIC, NOT EVEN, and that is not a refinement --
     an evenly spaced grid gets the game wrong.

     Under Coulomb friction distance goes as the SQUARE of speed, so the
     interesting shots are all crowded into the bottom of the speed range:
     roughly 0.63 m/s just reaches the 15 line, 0.83-1.20 is the band that
     sinks a 20, and everything above about 1.6 is simply "hard". An evenly
     spaced grid spends most of its samples in that last, uninteresting
     region -- and with four powers it steps straight over the 20 band,
     which is exactly what made Medium unable to score an open 20 while
     Easy, whose coarser grid happened to land on 0.85, could.

     Spacing geometrically from just under the reach-the-15-line speed up
     to full power puts the resolution where the touch is. The bottom of
     the range is derived from the friction constant, so it follows if the
     board speed is ever retuned. */
  const vReach = Math.sqrt(2 * P.MU_SURFACE * P.G * (P.R_PLACE - P.R_15 - P.R_DISC));
  const lo = Math.max(P.V_MIN_SHOT, vReach * 0.88);
  const hi = P.V_MAX_SHOT;
  const powers = [];
  for (let i = 0; i < lvl.powers; i++){
    const f = lvl.powers === 1 ? 1 : i / (lvl.powers - 1);
    powers.push(lo * Math.pow(hi / lo, f));
  }

  for (const pp of places){
    for (const tg of targets){
      const base = Math.atan2(tg.y - pp.y, tg.x - pp.x);
      /* jitter around the true line so cut shots and edge contacts, which
         are most of real crokinole, are actually in the candidate set */
      const jit = lvl.targetJitter;
      for (let j = 0; j < jit; j++){
        const off = jit === 1 ? 0 : ((j / (jit - 1)) - 0.5) * 0.075;
        for (const v of powers){
          out.push({ owner: me, x: pp.x, y: pp.y, angle: base + off, speed: v, w: 0, kind: tg.kind });
        }
      }
    }
    /* blind sweep, for banks off the pegs nobody aimed at */
    for (let i = 0; i < lvl.sweep; i++){
      const a = cq + Math.PI - 0.62 + (1.24 * i) / Math.max(1, lvl.sweep - 1);
      out.push({ owner: me, x: pp.x, y: pp.y, angle: a,
                 speed: powers[powers.length - 1], w: 0, kind: 'sweep' });
    }
  }
  return out;
};

function toShot(c){
  return { owner: c.owner, x: c.x, y: c.y,
           vx: Math.cos(c.angle) * c.speed, vy: Math.sin(c.angle) * c.speed, w: c.w || 0 };
}

/* ==========================================================================
   8c. CHOOSE
   ========================================================================== */

AI.think = function(geo, world, me, difficulty, rng, banked){
  const lvl = AI.LEVELS[difficulty] || AI.LEVELS.medium;
  let pool = AI.candidates(geo, world, me, lvl, rng);
  let scored = [];

  const score = (c) => {
    const r = PHYS.runShot(world, toShot(c), { frames: false });
    const j = RULES.judgeShot(geo, world, r, me);
    let s = AI.evaluate(geo, world, r, me, banked);
    if (!j.valid) s -= AI.W.foul;
    return { c, s, valid: j.valid };
  };

  for (const c of pool) scored.push(score(c));
  scored.sort((a, b) => b.s - a.s);

  /* local refinement around the leaders: nudge aim and power and keep any
     improvement. This is what lets Hard find the thin cut that clears two
     discs, which no grid is fine enough to contain. */
  for (let pass = 0; pass < lvl.refine; pass++){
    const seeds = scored.slice(0, 4);
    for (const seed of seeds){
      const stepA = 0.02 / (pass + 1), stepV = 0.09 / (pass + 1);
      for (const da of [-stepA, -stepA * 0.4, stepA * 0.4, stepA]){
        for (const dv of [1 - stepV, 1, 1 + stepV]){
          const c = { ...seed.c, angle: seed.c.angle + da,
                      speed: clamp(seed.c.speed * dv, geo.P.V_MIN_SHOT, geo.P.V_MAX_SHOT) };
          scored.push(score(c));
        }
      }
    }
    scored.sort((a, b) => b.s - a.s);
    scored.length = Math.min(scored.length, 90);
  }

  if (!scored.length) return null;

  /* --- would I actually make it? ---------------------------------------
     The ranking so far assumes a perfect strike. Re-score the leaders by
     playing each one several times through this player's own hands, and
     keep the average. This is what stops the AI choosing a shot that
     scores 20 struck perfectly and flies off the board struck the way it
     really strikes -- exactly the failure that made Medium worse than Easy
     in an earlier version: a full-power sweep tied with a gentle roll on a
     noiseless simulation, and the tie was broken by luck. */
  if (lvl.robustK && lvl.robustN){
    const K = Math.min(lvl.robustK, scored.length);
    for (let i = 0; i < K; i++){
      const cand = scored[i];
      let sum = 0;
      for (let n = 0; n < lvl.robustN; n++){
        const shaken = {
          ...cand.c,
          angle: cand.c.angle + rng.normal() * lvl.aimSd,
          speed: clamp(cand.c.speed * (1 + rng.normal() * lvl.powSd),
                       geo.P.V_MIN_SHOT, geo.P.V_MAX_SHOT),
        };
        sum += score(shaken).s;
      }
      /* the average outcome, not the best case */
      cand.s = sum / lvl.robustN;
    }
    scored.length = K;
    scored.sort((a, b) => b.s - a.s);
  }

  /* Easy and Medium do not always take the best line. Choosing among the
     top few is what stops an easy opponent from looking like a strong one
     with shaky hands. */
  const top = scored.slice(0, Math.max(1, lvl.pickTop));
  const chosen = top[rng.int(top.length)];

  /* --- and now miss it, humanly ---------------------------------------- */
  /* Aim error is Gaussian in angle. Power error is proportional to power,
     because that is how a physical flick errs -- you are off by a
     percentage of your effort, not by a fixed number of millimetres per
     second. */
  const aimErr = rng.normal() * lvl.aimSd;
  const powErr = 1 + rng.normal() * lvl.powSd;
  const executed = {
    ...chosen.c,
    angle: chosen.c.angle + aimErr,
    speed: clamp(chosen.c.speed * powErr, geo.P.V_MIN_SHOT, geo.P.V_MAX_SHOT),
  };
  /* a hand that is off-line also tends to put a little spin on it */
  executed.w = -(clamp(aimErr * 9, -1, 1) * geo.P.R_DISC * geo.P.M_DISC * executed.speed) / geo.P.I_DISC;

  return {
    shot: toShot(executed),
    intended: toShot(chosen.c),
    considered: scored.length,
    best: chosen.s,
    kind: chosen.c.kind,
    level: lvl.label,
  };
};
/* ==========================================================================
   9. SOUND
   --------------------------------------------------------------------------
   Synthesised, not sampled -- the file stays self-contained and a click made
   from the actual impulse of the actual collision carries information a
   fixed sample cannot. Every impact the solver reports has a magnitude, so
   a hard takeout cracks and a delicate kiss ticks, from the same code.

   Wood is a short, bright, fast-decaying noise burst through a resonant
   band; the pitch of the resonance rises a little with impact strength
   because a harder hit excites higher modes. The peg's rubber sleeve gets a
   lower, duller, shorter version. The 20 gets the one pitched sound in the
   game, because dropping one should feel like an event.
   ========================================================================== */

const SFX = {};
CROK.SFX = SFX;

SFX.ctx = null;
SFX.on = true;
SFX.noise = null;

SFX.init = function(){
  if (SFX.ctx) return SFX.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  SFX.ctx = new AC();
  /* one second of deterministic noise, generated once and reused. Seeded,
     so the same shot sounds identical twice -- the same reason the physics
     is seeded. */
  const n = SFX.ctx.sampleRate;
  const buf = SFX.ctx.createBuffer(1, n, n);
  const ch = buf.getChannelData(0);
  const rng = Rng(0x51ced);
  for (let i = 0; i < n; i++) ch[i] = rng.next() * 2 - 1;
  SFX.noise = buf;
  return SFX.ctx;
};

/* iOS will not start an AudioContext except inside a user gesture */
SFX.resume = function(){
  const c = SFX.init();
  if (c && c.state === 'suspended') c.stop = c.resume();
};

function burst(t, opts){
  const c = SFX.ctx;
  if (!c || !SFX.on) return;
  const src = c.createBufferSource();
  src.buffer = SFX.noise;
  src.loop = true;
  const bp = c.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = opts.freq;
  bp.Q.value = opts.q;
  const g = c.createGain();
  const hp = c.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 180;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(opts.gain, t + 0.0012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + opts.decay);
  src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(c.destination);
  src.start(t); src.stop(t + opts.decay + 0.02);
}

function tone(t, opts){
  const c = SFX.ctx;
  if (!c || !SFX.on) return;
  const o = c.createOscillator();
  o.type = opts.type || 'triangle';
  o.frequency.setValueAtTime(opts.f0, t);
  if (opts.f1) o.frequency.exponentialRampToValueAtTime(opts.f1, t + opts.decay);
  const g = c.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(opts.gain, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + opts.decay);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + opts.decay + 0.02);
}

/* strength: 0..1, from the collision impulse */
SFX.hitDisc = function(when, strength){
  const s = clamp(strength, 0, 1);
  burst(when, { freq: 1500 + 2600 * s, q: 3.2 + 5 * s,
                gain: 0.055 + 0.34 * s, decay: 0.045 + 0.075 * s });
  /* the body of the wood under the click */
  burst(when, { freq: 420 + 260 * s, q: 5, gain: 0.03 + 0.13 * s, decay: 0.075 });
};
SFX.hitPeg = function(when, strength){
  const s = clamp(strength, 0, 1);
  burst(when, { freq: 620 + 700 * s, q: 2.0, gain: 0.05 + 0.2 * s, decay: 0.035 + 0.03 * s });
};
SFX.flick = function(when, power){
  burst(when, { freq: 2400, q: 1.1, gain: 0.03 + 0.09 * power, decay: 0.035 });
};
SFX.twenty = function(when){
  burst(when, { freq: 900, q: 2, gain: 0.16, decay: 0.05 });
  tone(when + 0.02,  { f0: 784,  f1: 780,  gain: 0.10, decay: 0.28, type: 'triangle' });
  tone(when + 0.075, { f0: 1175, f1: 1170, gain: 0.09, decay: 0.34, type: 'triangle' });
  tone(when + 0.13,  { f0: 1568, f1: 1560, gain: 0.075, decay: 0.5,  type: 'triangle' });
};
SFX.ditch = function(when){
  burst(when, { freq: 300, q: 1.4, gain: 0.13, decay: 0.16 });
  tone(when + 0.03, { f0: 150, f1: 70, gain: 0.05, decay: 0.2, type: 'sine' });
};
SFX.foul = function(when){
  tone(when,        { f0: 320, f1: 190, gain: 0.09, decay: 0.2, type: 'sawtooth' });
  tone(when + 0.12, { f0: 240, f1: 120, gain: 0.08, decay: 0.28, type: 'sawtooth' });
};
SFX.ui = function(hot){
  const c = SFX.init(); if (!c) return;
  tone(c.currentTime, { f0: hot ? 660 : 440, f1: hot ? 880 : 520,
                        gain: 0.045, decay: 0.09, type: 'square' });
};
SFX.roundEnd = function(win){
  const c = SFX.init(); if (!c) return;
  const t = c.currentTime;
  const notes = win ? [523, 659, 784, 1047] : [523, 466, 415];
  notes.forEach((f, i) => tone(t + i * 0.11,
    { f0: f, f1: f * 0.995, gain: 0.075, decay: 0.4, type: 'triangle' }));
};
/* ==========================================================================
   10. THE GAME
   --------------------------------------------------------------------------
   The state machine, and the place where the one-simulation rule earns its
   keep. When a shot is released:

     1. the solver runs the whole shot to rest, right now, in one call
     2. the rules judge the finished result
     3. the animation plays back the frames the solver already produced
     4. when the playback reaches the end, the settled world is adopted and
        the after-the-shot rules (bank the 20s, ditch what is out) apply

   Physics never runs on the render clock. A dropped frame, a slow device or
   a 120 Hz iPad changes how smoothly you watch the shot and cannot change
   where the discs end up. That is also why the preview cannot lie: it is
   step 1 with the drawing turned on.

   STATES
     aim        waiting for a flick (or for the AI to decide)
     playing    animating a shot that has already been decided
     settle     a short beat after the motion for the callouts to land
     roundOver  the round modal is up
     matchOver  the match modal is up
     paused
   ========================================================================== */

const GAME = {};
CROK.GAME = GAME;

GAME.create = function(host){
  const g = {
    host,
    geo: null,
    world: null,
    match: null,
    state: 'idle',
    shooter: 0,
    left: [0, 0],            /* discs still to shoot this round            */
    banked: [0, 0],          /* points from sunk 20s (safe for the round)  */
    twenties: [0, 0],        /* count of 20s, tracked as a scorecard does  */
    rng: null,
    /* the shot in flight */
    play: null,              /* {frames, events, t, dur, verdict, result}  */
    pending: null,           /* the disc placed but not yet flicked        */
    aim: null, power: 0, preview: null,
    lastVerdict: null,
    aiThinking: false,
    settleT: 0,
  };

  /* ---------------------------------------------------------------- setup */
  g.startMatch = function(cfg){
    g.geo = GEO.build(SPEC);
    g.match = RULES.newMatch(cfg);
    g.rng = Rng(cfg.seed || 20260903);
    g.match.firstShooter = 0;
    g.startRound();
  };

  g.startRound = function(){
    g.world = PHYS.newWorld(g.geo);
    g.left = [SPEC.DISCS_EACH, SPEC.DISCS_EACH];
    g.banked = [0, 0];
    g.twenties = [0, 0];
    g.shooter = g.match.firstShooter;
    g.lastVerdict = null;
    g.beginTurn();
  };

  /* ----------------------------------------------------------- the turn */
  g.beginTurn = function(){
    if (g.left[0] === 0 && g.left[1] === 0){ g.endRound(); return; }
    /* If one player is out of discs the other shoots out their remaining
       ones. With 8 each and strict alternation that only happens after a
       foul takes a disc, but it has to be handled or a round can hang. */
    if (g.left[g.shooter] === 0) g.shooter = 1 - g.shooter;

    g.state = 'aim';
    g.pending = null; g.aim = null; g.power = 0; g.preview = null;
    /* A human shooter always has a disc sitting on the line ready to go, in
       the middle of their arc. You never have to place one before you can
       shoot -- tapping only MOVES it. */
    if (!g.isAI(g.shooter)){
      const pl = g.geo.placement(g.shooter);
      g.place(pl.r * Math.cos(pl.c), pl.r * Math.sin(pl.c));
    }
    g.host.onTurn(g);
    if (typeof APP !== 'undefined' && APP.setArmed) APP.setArmed(false);

    if (g.isAI(g.shooter)){
      g.aiThinking = true;
      /* let the HUD paint "thinking" before the search blocks the thread */
      g.host.defer(() => g.aiMove(), 380);
    }
  };

  g.isAI = function(who){ return g.match.cfg.mode === 'ai' && who === 1; };

  g.aiMove = function(){
    if (g.state !== 'aim' || !g.aiThinking) return;
    g.aiThinking = false;
    const think = AI.think(g.geo, g.world, g.shooter, g.match.cfg.difficulty,
                           g.rng, g.banked);
    if (!think){ g.takeShot({ owner: g.shooter, x: g.geo.placement(g.shooter).r,
                              y: 0, vx: 0, vy: 0, w: 0 }); return; }
    g.host.onAIChose(think);
    g.takeShot(think.shot);
  };

  /* --------------------------------------------------- placement and aim */
  g.place = function(bx, by){
    if (g.state !== 'aim' || g.isAI(g.shooter)) return null;
    const p = g.geo.freePlacement(g.shooter, bx, by, g.world.discs);
    g.pending = { id: -1, owner: g.shooter, x: p.x, y: p.y, a: 0, w: 0, live: true };
    g.aim = null; g.power = 0; g.preview = null;
    return g.pending;
  };

  /* Show the shot a gesture currently describes. The preview is a real run
     of the real solver on the real board -- the same call that fires when
     the finger lifts -- so what is drawn is what will happen. Called at
     most once a frame however many pointer events arrived. */
  g.setAim = function(shot, power, aimPt){
    if (g.state !== 'aim' || !g.pending) return;
    if (!shot){ g.aim = null; g.power = 0; g.preview = null; return; }
    g.power = clamp(power, 0, 1);
    const L = hypot(shot.vx, shot.vy) || 1;
    g.aim = aimPt || { x: g.pending.x + (shot.vx / L) * SPEC.R_DISC * 4,
                       y: g.pending.y + (shot.vy / L) * SPEC.R_DISC * 4 };
    g.shotDraft = shot;
    if (g.host.setting('preview') === 'off'){ g.preview = null; return; }
    g.preview = PHYS.runShot(g.world, shot, { frames: false });
  };

  g.cancelAim = function(){
    if (g.state !== 'aim') return;
    g.aim = null; g.power = 0; g.preview = null;
  };

  /* ------------------------------------------------------------ the shot */
  g.takeShot = function(shot){
    if (g.state !== 'aim') return;
    /* the one call: the whole shot, decided now */
    const result = PHYS.runShot(g.world, shot, { frames: true });
    const verdict = RULES.judgeShot(g.geo, g.world, result, shot.owner);

    g.left[shot.owner]--;
    g.state = 'playing';
    g.pending = null; g.aim = null; g.preview = null;
    g.play = { result, verdict, t: 0,
               dur: (result.frames.length - 1) / SPEC.SAMPLE_HZ,
               fired: 0, shot };
    g.host.onShotFired(g, shot, result, verdict);
  };

  /* ---------------------------------------------- animation and its end */
  g.advance = function(dt){
    if (g.state === 'playing'){
      const p = g.play;
      p.t += dt;
      /* fire the sounds for contacts the playback has just passed */
      while (p.fired < p.result.events.length && p.result.events[p.fired].t <= p.t){
        g.host.onEvent(p.result.events[p.fired], p.t);
        p.fired++;
      }
      if (p.t >= p.dur){ g.finishShot(); }
    } else if (g.state === 'settle'){
      g.settleT -= dt;
      if (g.settleT <= 0){
        if (g.left[0] === 0 && g.left[1] === 0) g.endRound();
        else { g.shooter = 1 - g.shooter; g.beginTurn(); }
      }
    }
  };

  g.finishShot = function(){
    const p = g.play;
    /* adopt the settled board the solver produced */
    g.world = p.result.world;
    for (const d of g.world.discs) d.shooter = false;

    let removed = [];
    if (!p.verdict.valid) removed = RULES.applyFoul(p.result);
    const swept = RULES.endTurn(g.geo, g.world, g.banked, g.twenties);

    g.lastVerdict = p.verdict;
    g.host.onShotSettled(g, p.verdict, swept, removed);
    g.state = 'settle';
    g.settleT = p.verdict.valid ? 0.42 : 1.0;
    g.play = null;
  };

  /* ------------------------------------------------------- end of round */
  g.endRound = function(){
    const t = RULES.tally(g.geo, g.world, g.banked);
    const res = RULES.finishRound(g.match, t.pts, g.twenties);
    g.state = g.match.over ? 'matchOver' : 'roundOver';
    g.host.onRoundOver(g, t, res);
  };

  g.nextRound = function(){
    if (g.match.over) return;
    g.startRound();
  };

  /* ---------------------------------------------------- what to draw now */
  /* During playback the discs are read out of the solver's frames, with
     linear interpolation between samples so a 120 Hz board looks smooth on
     any refresh rate. */
  g.viewState = function(){
    const st = {
      world: g.world, shooter: g.shooter, pending: g.pending,
      aim: g.aim, power: g.power, preview: g.preview,
      previewMode: g.host.setting('preview'),
      showArcs: g.state === 'aim',
      aiming: !!(APP.state && APP.state.aiming),
      settle: (APP.state && APP.state.aimSettle) || 0,
      geo: g.geo,
    };
    if (g.state === 'playing' && g.play){
      const p = g.play, fr = p.result.frames;
      const f = clamp(p.t * SPEC.SAMPLE_HZ, 0, fr.length - 1);
      const i0 = Math.floor(f), i1 = Math.min(fr.length - 1, i0 + 1);
      const u = f - i0;
      const A = fr[i0], B = fr[i1];
      const ds = p.result.world.discs;
      const shown = [];
      for (let i = 0; i < ds.length; i++){
        const flagA = A[i * 4 + 3];
        if (flagA !== 1) continue;             /* already gone by this frame */
        shown.push({
          id: ds[i].id, owner: ds[i].owner, live: true,
          x: lerp(A[i * 4],     B[i * 4],     u),
          y: lerp(A[i * 4 + 1], B[i * 4 + 1], u),
          a: A[i * 4 + 2] + angDiff(A[i * 4 + 2], B[i * 4 + 2]) * u,
        });
      }
      st.world = { geo: g.geo, discs: shown };
      st.showArcs = false;
    }
    return st;
  };

  return g;
};
/* ==========================================================================
   11. THE APP -- screens, HUD, the loop
   ========================================================================== */

const APP = {};
CROK.APP = APP;

const el = id => document.getElementById(id);

/* Is the hand on glass or on a trackpad? Answered from the last pointer
   actually seen, because a device can have both, and it decides the whole
   shape of the gesture: glass shoots when the touch ends, a trackpad when
   the cursor stops. */
APP.isTouch = function(){
  const k = APP.state.lastKind;
  if (k) return k === 'touch' || k === 'pen';
  return typeof navigator !== 'undefined' && navigator.maxTouchPoints > 0;
};

APP.settings = { input: 'flick', preview: 'full', rotate: 'on',
                 sound: 'on', labels: 'on' };
APP.setup = { mode: 'ai', bestOf: 3, difficulty: 'medium' };

APP.state = { screen: 'menu', game: null, view: null, ctx: null, canvas: null,
              raf: 0, last: 0, needAim: false, aimArgs: null,
              flicking: false, downT: 0, toastT: 0,
              /* AIMING. The disc has been clicked and where the cursor
                 sits is now the shot: direction from the disc towards it,
                 force from how far away it is. */
              aiming: false, aimPx: 0, aimPy: 0, aimHeldSince: 0,
              aimSettle: 0, dragged: false, downX: 0, downY: 0, lastKind: '',
              /* PEAK-HOLD. In velocity mode the power of a flick is how fast
                 you were moving -- but a player lining up a shot stops
                 moving to aim, and reading the instantaneous speed at that
                 moment gives zero, so the trajectory line vanishes exactly
                 when it is most wanted, and a careful shot cannot be taken
                 at all. So power is the PEAK speed over a short trailing
                 window rather than the speed at one instant. It holds while
                 you settle on a line, and it is the same number the shot is
                 fired with, so the preview still cannot lie. */
              peakSpeed: 0, peakAt: -1 };
APP.PEAK_HOLD = 0.40;      /* seconds a peak survives without being beaten */
/* What separates a tap from a flick. Generous on distance because a finger
   never lands perfectly still, and on time because deciding where to put
   your disc is not a race. */
APP.TAP_SLOP = 14;         /* css px of travel still counts as a tap       */
/* how long the cursor must sit still before a trackpad shot goes */
APP.AIM_SETTLE = 0.55;
APP.TAP_TIME = 0.6;        /* seconds */
/* A flick has to be clearly faster than moving the cursor around, or the
   shot goes off while you are still deciding. Measured in BOARD metres per
   second, so it means the same on any screen size: 0.55 is a little under
   one board-width per second. */
APP.FLICK_MIN = 0.55;
APP.FLICK_END = 0.55;      /* fires once the speed falls to this share of its peak */
APP.FLICK_IDLE = 0.10;     /* ...or after this long with no movement at all */

/* ---------------------------------------------------------------- screens */
APP.show = function(name){
  for (const s of ['menu', 'setup', 'settings', 'credits', 'game']){
    const n = el('screen-' + s);
    if (n) n.classList.toggle('on', s === name);
  }
  APP.state.screen = name;
  if (name === 'game') APP.resize();
};

APP.modal = function(html){
  const m = el('modal');
  if (!html){ m.classList.remove('on'); el('modal-card').innerHTML = ''; return; }
  el('modal-card').innerHTML = html;
  m.classList.add('on');
};

APP.toast = function(big, small, cls){
  const t = el('toast');
  el('toast-big').textContent = big || '';
  el('toast-big').className = 'big' + (cls ? ' ' + cls : '');
  el('toast-small').textContent = small || '';
  t.classList.toggle('on', !!big);
  APP.state.toastT = big ? 1.5 : 0;
};

/* --------------------------------------------------------- segmented rows */
function seg(id, key, store, after){
  const box = el(id);
  if (!box) return;
  box.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    let v = b.dataset.v;
    if (/^\d+$/.test(v)) v = parseInt(v, 10);
    store[key] = v;
    for (const btn of box.querySelectorAll('button')){
      btn.setAttribute('aria-pressed', String(btn === b));
    }
    SFX.ui(false);
    if (after) after(v);
  });
  for (const btn of box.querySelectorAll('button')){
    let v = btn.dataset.v;
    if (/^\d+$/.test(v)) v = parseInt(v, 10);
    btn.setAttribute('aria-pressed', String(v === store[key]));
  }
}

/* ------------------------------------------------------------ the canvas */
APP.resize = function(){
  const s = APP.state;
  if (!s.canvas) return;
  const rect = s.canvas.getBoundingClientRect();
  const w = Math.max(1, rect.width), h = Math.max(1, rect.height);
  /* Cap the backing store. A 12.9" iPad at devicePixelRatio 2 is already
     4.4 megapixels; going higher costs fill rate for nothing a retina eye
     can see, and the board layer has to be re-baked every time it changes. */
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  s.canvas.width = Math.round(w * dpr);
  s.canvas.height = Math.round(h * dpr);
  if (!s.view) s.view = RENDER.newView();
  const g = s.game;
  const rot = APP.boardRotation();
  RENDER.layout(s.view, g ? g.geo : GEO.build(SPEC), w, h, dpr, rot);
  s.view.board = null;             /* force a re-bake at the new size      */
};

/* Turn the board so the player about to shoot is looking up their own
   quadrant from the bottom of the screen. On one shared iPad this is the
   difference between aiming and doing geometry in your head. */
APP.boardRotation = function(){
  const g = APP.state.game;
