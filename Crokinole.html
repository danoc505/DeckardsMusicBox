<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#07070c">
<title>CROKINOLE</title>
<style>
/* ==========================================================================
   CROKINOLE -- wooden board, neon retrofuturism.

   One self-contained file. No build step, no server, no dependencies.
   ========================================================================== */

:root{
  /* the dark */
  --ink:        #07070c;
  --ink-2:      #0d0d16;
  --ink-3:      #14141f;
  --hair:       #23233a;

  /* the neon */
  --cyan:       #22e0ff;
  --cyan-dim:   #0d7f96;
  --magenta:    #ff2b8f;
  --magenta-dim:#8f1450;
  --amber:      #ffb020;
  --violet:     #9d5cff;
  --lime:       #7cff4d;

  /* the players */
  --p1:         #ff3355;   /* neon red   */
  --p1-glow:    #ff6b80;
  --p2:         #22b8ff;   /* neon blue  */
  --p2-glow:    #7ad9ff;

  /* the wood */
  --maple:      #c99a5b;
  --maple-lo:   #8d6437;

  --text:       #e8e8f4;
  --text-dim:   #8a8aa6;

  --ui-scale:   1;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0; width:100%; height:100%;
  overflow:hidden;
  background:var(--ink);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
  /* No browser gestures anywhere: no pan, no pinch-zoom, no double-tap zoom,
     no rubber-band scroll, no text selection, no long-press callout. */
  touch-action:none;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  overscroll-behavior:none;
  position:fixed; inset:0;
}

#app{ position:fixed; inset:0; }

/* --- the starfield/grid backdrop, shared by every screen ----------------- */
.backdrop{
  position:absolute; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(circle at 50% 42%, #191932 0%, #0b0b14 55%, #07070c 100%);
}
.backdrop::after{
  content:''; position:absolute; inset:-20%;
  background-image:
    linear-gradient(to right, rgba(34,224,255,.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(34,224,255,.055) 1px, transparent 1px);
  background-size:48px 48px;
  transform:perspective(520px) rotateX(66deg) translateY(18%);
  mask-image:linear-gradient(to bottom, transparent 6%, #000 48%, transparent 92%);
  -webkit-mask-image:linear-gradient(to bottom, transparent 6%, #000 48%, transparent 92%);
}
.scanlines{
  position:absolute; inset:0; z-index:60; pointer-events:none; opacity:.16;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.55) 2px 3px);
  mix-blend-mode:multiply;
}

/* --- screens ------------------------------------------------------------- */
.screen{
  position:absolute; inset:0; z-index:10;
  display:none;
  flex-direction:column; align-items:center; justify-content:center;
  padding:max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
          max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}
.screen.on{ display:flex; }

/* --- type ---------------------------------------------------------------- */
.wordmark{
  font-size:clamp(38px, 10vmin, 104px);
  font-weight:800; letter-spacing:.22em; margin:0 0 .1em -.22em;
  color:#fff;
  text-shadow:
    0 0 4px #fff,
    0 0 14px var(--cyan),
    0 0 38px var(--cyan),
    0 0 76px rgba(34,224,255,.55),
    0 0 120px rgba(255,43,143,.35);
}
.tagline{
  font-size:clamp(10px, 1.9vmin, 15px); letter-spacing:.42em; text-transform:uppercase;
  color:var(--magenta); margin:0 0 clamp(22px,5vmin,52px) 0;
  text-shadow:0 0 10px var(--magenta), 0 0 30px rgba(255,43,143,.5);
}
.screen-title{
  font-size:clamp(17px, 3.1vmin, 30px); font-weight:700; letter-spacing:.3em;
  text-transform:uppercase; color:var(--cyan); margin:0 0 clamp(16px,3.4vmin,34px);
  text-shadow:0 0 10px var(--cyan), 0 0 34px rgba(34,224,255,.45);
}

/* --- buttons ------------------------------------------------------------- */
.btn{
  -webkit-appearance:none; appearance:none;
  display:flex; align-items:center; justify-content:center; gap:.6em;
  min-width:min(78vw, 340px); min-height:56px;
  margin:7px 0; padding:15px 34px;
  font:inherit; font-size:clamp(13px,2.1vmin,18px); font-weight:700;
  letter-spacing:.2em; text-transform:uppercase;
  color:var(--cyan); background:rgba(34,224,255,.055);
  border:1.5px solid var(--cyan-dim); border-radius:3px;
  box-shadow:0 0 0 1px rgba(34,224,255,.09) inset, 0 0 18px rgba(34,224,255,.14);
  text-shadow:0 0 10px rgba(34,224,255,.75);
  cursor:pointer; transition:background .12s, box-shadow .12s, color .12s, transform .06s;
}
.btn:active{ transform:translateY(1px) scale(.995); }
.btn.hot{ color:var(--magenta); border-color:var(--magenta-dim);
  background:rgba(255,43,143,.07); text-shadow:0 0 10px rgba(255,43,143,.8);
  box-shadow:0 0 0 1px rgba(255,43,143,.1) inset, 0 0 22px rgba(255,43,143,.2); }
.btn.ghost{ color:var(--text-dim); border-color:var(--hair); background:transparent;
  box-shadow:none; text-shadow:none; min-height:48px; }
@media (hover:hover){
  .btn:hover{ background:rgba(34,224,255,.13); box-shadow:0 0 0 1px rgba(34,224,255,.2) inset, 0 0 30px rgba(34,224,255,.3); }
  .btn.hot:hover{ background:rgba(255,43,143,.16); box-shadow:0 0 0 1px rgba(255,43,143,.22) inset, 0 0 32px rgba(255,43,143,.34); }
  .btn.ghost:hover{ color:var(--text); border-color:var(--text-dim); }
}

/* --- segmented option rows ---------------------------------------------- */
.row{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  width:min(88vw, 460px); margin:8px 0;
}
.row > .label{
  font-size:clamp(10px,1.7vmin,13px); letter-spacing:.24em; text-transform:uppercase;
  color:var(--text-dim); white-space:nowrap;
}
.seg{ display:flex; gap:6px; }
.seg button{
  -webkit-appearance:none; appearance:none;
  min-width:52px; min-height:44px; padding:9px 15px;
  font:inherit; font-size:clamp(11px,1.8vmin,15px); font-weight:700; letter-spacing:.12em;
  color:var(--text-dim); background:transparent;
  border:1.5px solid var(--hair); border-radius:3px; cursor:pointer;
  transition:all .12s;
}
.seg button[aria-pressed="true"]{
  color:var(--ink); background:var(--cyan); border-color:var(--cyan);
  box-shadow:0 0 16px rgba(34,224,255,.5), 0 0 40px rgba(34,224,255,.22);
}
.hint{
  width:min(88vw,460px); margin:4px 0 0; min-height:2.6em;
  font-size:clamp(10px,1.6vmin,12.5px); line-height:1.55; color:var(--text-dim);
  letter-spacing:.03em;
}
.spacer{ height:clamp(10px,2.4vmin,26px); }

/* --- the game screen ----------------------------------------------------- */
#screen-game{ display:none; padding:0; }
#screen-game.on{ display:block; }
#stage{ position:absolute; inset:0; }
#board-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

/* --- HUD ----------------------------------------------------------------- */
#hud{ position:absolute; inset:0; z-index:20; pointer-events:none;
  padding:max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
          max(10px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
#hud .pane{ position:absolute; }

.score-card{
  min-width:118px; padding:9px 15px 10px;
  background:rgba(7,7,12,.62); border:1.5px solid var(--hair); border-radius:4px;
  backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  transition:border-color .2s, box-shadow .2s;
}
.score-card .who{
  font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--text-dim);
  display:flex; align-items:center; gap:7px;
}
.score-card .who i{ width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
.score-card .pts{ font-size:34px; font-weight:800; line-height:1.05; letter-spacing:.02em; }
.score-card .sub{ font-size:10.5px; letter-spacing:.14em; color:var(--text-dim); text-transform:uppercase; }
.score-card.p1 .pts{ color:var(--p1); text-shadow:0 0 14px rgba(255,51,85,.65); }
.score-card.p2 .pts{ color:var(--p2); text-shadow:0 0 14px rgba(34,184,255,.65); }
.score-card.p1 .who i{ background:var(--p1); box-shadow:0 0 9px var(--p1); }
.score-card.p2 .who i{ background:var(--p2); box-shadow:0 0 9px var(--p2); }
.score-card.active{ border-color:currentColor; }
.score-card.p1.active{ border-color:var(--p1); box-shadow:0 0 22px rgba(255,51,85,.32); }
.score-card.p2.active{ border-color:var(--p2); box-shadow:0 0 22px rgba(34,184,255,.32); }

#pane-round{ left:50%; top:max(10px, env(safe-area-inset-top)); transform:translateX(-50%);
  text-align:center; }
#pane-round .rnd{ font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--cyan);
  text-shadow:0 0 11px rgba(34,224,255,.6); }
#pane-round .match{ font-size:10.5px; letter-spacing:.19em; text-transform:uppercase; color:var(--text-dim); margin-top:3px; }

#pane-prompt{ left:50%; bottom:max(12px, env(safe-area-inset-bottom)); transform:translateX(-50%);
  text-align:center; width:min(94vw,760px); }
#prompt-main{ font-size:clamp(12px,2vmin,16px); font-weight:700; letter-spacing:.22em; text-transform:uppercase; }
#prompt-sub{ font-size:clamp(10px,1.6vmin,12.5px); letter-spacing:.1em; color:var(--text-dim); margin-top:5px; min-height:1.4em; }

#pane-discs{ left:50%; transform:translateX(-50%); bottom:calc(max(12px, env(safe-area-inset-bottom)) + 56px);
  display:flex; gap:22px; align-items:center; }
.disc-track{ display:flex; gap:5px; align-items:center; }
.disc-pip{ width:11px; height:11px; border-radius:50%; border:1.5px solid; opacity:.32; }
.disc-pip.left{ opacity:1; }
.disc-track.p1 .disc-pip{ border-color:var(--p1); }
.disc-track.p1 .disc-pip.left{ background:var(--p1); box-shadow:0 0 9px var(--p1); }
.disc-track.p2 .disc-pip{ border-color:var(--p2); }
.disc-track.p2 .disc-pip.left{ background:var(--p2); box-shadow:0 0 9px var(--p2); }

#btn-pause{
  pointer-events:auto; position:absolute;
  right:max(12px, env(safe-area-inset-right)); top:max(10px, env(safe-area-inset-top));
  width:46px; height:46px; padding:0; min-width:0; min-height:0; margin:0;
  font-size:15px; letter-spacing:0;
}

/* toast: the settling / foul / score callouts */
#toast{
  position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
  z-index:30; pointer-events:none; text-align:center;
  opacity:0; transition:opacity .22s;
}
#toast.on{ opacity:1; }
#toast .big{
  font-size:clamp(26px,7vmin,72px); font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  color:#fff; text-shadow:0 0 6px #fff, 0 0 26px var(--cyan), 0 0 64px var(--cyan);
}
#toast .big.foul{ text-shadow:0 0 6px #fff, 0 0 26px var(--magenta), 0 0 64px var(--magenta); }
#toast .big.twenty{ text-shadow:0 0 6px #fff, 0 0 26px var(--amber), 0 0 64px var(--amber), 0 0 120px rgba(255,176,32,.6); }
#toast .small{ font-size:clamp(10px,1.8vmin,14px); letter-spacing:.26em; text-transform:uppercase; color:var(--text-dim); margin-top:8px; }

/* --- modal (pause / round end / game end) -------------------------------- */
#modal{
  position:absolute; inset:0; z-index:40; display:none;
  align-items:center; justify-content:center;
  background:rgba(7,7,12,.82); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
  padding:max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
}
#modal.on{ display:flex; }
.card{
  width:min(92vw,520px); max-height:92vh; overflow:auto;
  padding:clamp(20px,4vmin,38px);
  background:linear-gradient(180deg, rgba(20,20,31,.96), rgba(10,10,18,.96));
  border:1.5px solid var(--hair); border-radius:6px;
  box-shadow:0 0 60px rgba(0,0,0,.7), 0 0 0 1px rgba(34,224,255,.07) inset;
  display:flex; flex-direction:column; align-items:center;
}
.card h2{
  margin:0 0 6px; font-size:clamp(19px,3.6vmin,34px); font-weight:800;
  letter-spacing:.16em; text-transform:uppercase; color:#fff; text-align:center;
  text-shadow:0 0 5px #fff, 0 0 24px var(--cyan), 0 0 58px rgba(34,224,255,.5);
}
.card h2.win{ text-shadow:0 0 5px #fff, 0 0 24px var(--amber), 0 0 58px rgba(255,176,32,.55); }
.card .lede{ margin:0 0 clamp(14px,3vmin,26px); font-size:clamp(11px,1.8vmin,14px);
  letter-spacing:.2em; text-transform:uppercase; color:var(--text-dim); text-align:center; }

.tally{ width:100%; margin:0 0 clamp(14px,3vmin,26px); border-collapse:collapse; font-variant-numeric:tabular-nums; }
.tally th{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--text-dim);
  font-weight:600; text-align:right; padding:0 0 8px; border-bottom:1px solid var(--hair); }
.tally th:first-child{ text-align:left; }
.tally td{ padding:9px 0; text-align:right; font-size:clamp(13px,2vmin,16px); border-bottom:1px solid rgba(35,35,58,.5); }
.tally td:first-child{ text-align:left; font-size:clamp(11px,1.7vmin,13px); letter-spacing:.16em;
  text-transform:uppercase; color:var(--text-dim); }
.tally tr.p1 td.v{ color:var(--p1); font-weight:700; }
.tally tr.p2 td.v{ color:var(--p2); font-weight:700; }
.tally tr.total td{ border-bottom:none; font-weight:800; font-size:clamp(15px,2.4vmin,20px); }

/* --- credits ------------------------------------------------------------- */
.prose{ width:min(90vw,620px); max-height:66vh; overflow:auto;
  font-size:clamp(11px,1.75vmin,13.5px); line-height:1.75; color:var(--text-dim); }
.prose h3{ color:var(--cyan); font-size:clamp(11px,1.8vmin,13px); letter-spacing:.24em;
  text-transform:uppercase; margin:1.6em 0 .5em; text-shadow:0 0 10px rgba(34,224,255,.4); }
.prose h3:first-child{ margin-top:0; }
.prose b{ color:var(--text); font-weight:600; }
.prose code{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.92em; color:var(--amber); }
.prose ul{ margin:.4em 0; padding-left:1.3em; }

/* --- landscape: cards to the sides --------------------------------------- */
@media (orientation:landscape){
  #pane-p1{ right:max(12px, env(safe-area-inset-right)); bottom:calc(max(10px, env(safe-area-inset-bottom)) + 4px); }
  #pane-p2{ left:max(12px, env(safe-area-inset-left)); top:calc(max(10px, env(safe-area-inset-top)) + 4px); }
}
@media (orientation:portrait){
  #pane-p1{ right:max(12px, env(safe-area-inset-right)); bottom:calc(max(10px, env(safe-area-inset-bottom)) + 84px); }
  #pane-p2{ left:max(12px, env(safe-area-inset-left)); top:calc(max(10px, env(safe-area-inset-top)) + 58px); }
}
</style>
</head>
<body>
<div id="app">
  <div class="backdrop"></div>

  <!-- ============================ MAIN MENU ============================ -->
  <section class="screen on" id="screen-menu">
    <h1 class="wordmark">CROKINOLE</h1>
    <p class="tagline">a physics simulation</p>
    <button class="btn hot" id="mm-practice">Practice Mode</button>
    <button class="btn" id="mm-settings">Settings</button>
    <button class="btn ghost" id="mm-credits">Credits</button>
  </section>

  <!-- ============================== SETUP ============================== -->
  <section class="screen" id="screen-setup">
    <h2 class="screen-title">Practice Mode</h2>
    <button class="btn" id="su-mode-local" aria-pressed="false">Local 2-Player</button>
    <button class="btn" id="su-mode-ai" aria-pressed="false">vs. AI</button>
    <div class="spacer"></div>
    <div class="row"><span class="label">Best of</span>
      <div class="seg" id="su-bestof">
        <button data-v="1" aria-pressed="false">1</button>
        <button data-v="3" aria-pressed="true">3</button>
        <button data-v="5" aria-pressed="false">5</button>
        <button data-v="7" aria-pressed="false">7</button>
      </div>
    </div>
    <div class="row" id="row-difficulty"><span class="label">Difficulty</span>
      <div class="seg" id="su-difficulty">
        <button data-v="easy" aria-pressed="true">Easy</button>
        <button data-v="medium" aria-pressed="false">Medium</button>
        <button data-v="hard" aria-pressed="false">Hard</button>
      </div>
    </div>
    <p class="hint" id="su-hint"></p>
    <div class="spacer"></div>
    <button class="btn hot" id="su-start">Start Game</button>
    <button class="btn ghost" id="su-back">Back</button>
  </section>

  <!-- ============================ SETTINGS ============================= -->
  <section class="screen" id="screen-settings">
    <h2 class="screen-title">Settings</h2>
    <div class="row"><span class="label">Trajectory preview</span>
      <div class="seg" id="set-preview">
        <button data-v="full" aria-pressed="true">Full</button>
        <button data-v="short" aria-pressed="false">Short</button>
        <button data-v="off" aria-pressed="false">Off</button>
      </div>
    </div>
    <div class="row"><span class="label">Rotate to shooter</span>
      <div class="seg" id="set-rotate">
        <button data-v="on" aria-pressed="true">On</button>
        <button data-v="off" aria-pressed="false">Off</button>
      </div>
    </div>
    <div class="row"><span class="label">Sound</span>
      <div class="seg" id="set-sound">
        <button data-v="on" aria-pressed="true">On</button>
        <button data-v="off" aria-pressed="false">Off</button>
      </div>
    </div>
    <div class="row"><span class="label">Zone labels</span>
      <div class="seg" id="set-labels">
        <button data-v="on" aria-pressed="true">On</button>
        <button data-v="off" aria-pressed="false">Off</button>
      </div>
    </div>
    <p class="hint" id="set-hint"></p>
    <div class="spacer"></div>
    <button class="btn ghost" id="set-back">Back</button>
  </section>

  <!-- ============================= CREDITS ============================= -->
  <section class="screen" id="screen-credits">
    <h2 class="screen-title">Credits</h2>
    <div class="prose" id="credits-body"></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="cr-back">Back</button>
  </section>

  <!-- ============================== GAME =============================== -->
  <section class="screen" id="screen-game">
    <div id="stage"><canvas id="board-canvas"></canvas></div>
    <div id="hud">
      <div class="pane score-card p1" id="pane-p1">
        <div class="who"><i></i><span id="p1-name">Player 1</span></div>
        <div class="pts" id="p1-pts">0</div>
        <div class="sub" id="p1-sub">on the board</div>
      </div>
      <div class="pane score-card p2" id="pane-p2">
        <div class="who"><i></i><span id="p2-name">Player 2</span></div>
        <div class="pts" id="p2-pts">0</div>
        <div class="sub" id="p2-sub">on the board</div>
      </div>
      <div class="pane" id="pane-round">
        <div class="rnd" id="round-label">Round 1 / 4</div>
        <div class="match" id="match-label">Best of 3</div>
      </div>
      <div class="pane" id="pane-discs">
        <div class="disc-track p2" id="track-p2"></div>
        <div class="disc-track p1" id="track-p1"></div>
      </div>
      <div class="pane" id="pane-prompt">
        <div id="prompt-main">Player 1 to shoot</div>
        <div id="prompt-sub"></div>
      </div>
      <button class="btn" id="btn-pause">| |</button>
    </div>
    <div id="toast"><div class="big" id="toast-big"></div><div class="small" id="toast-small"></div></div>
  </section>

  <!-- ============================== MODAL ============================== -->
  <div id="modal"><div class="card" id="modal-card"></div></div>

  <div class="scanlines"></div>
</div>
<script>
"use strict";
/* ==========================================================================
   CROKINOLE -- a physics simulation with a board around it.

   ONE FILE. No build step, no server, no dependencies, no network. Open it
   and play.

   ---------------------------------------------------------------------------
   THE FOUR LAWS THIS FILE IS WRITTEN UNDER
   ---------------------------------------------------------------------------
   1. PHYSICS FIRST. The simulation is the game. Everything else -- rules,
      rendering, AI, UI -- reads the simulation and never fakes it. There is
      no "close enough" path that moves a disc without the solver.

   2. ONE SIMULATION, TWO USES. The trajectory preview and the shot you
      actually take are THE SAME CALL to THE SAME SOLVER on THE SAME state.
      A shot is simulated to completion the instant it is released; the
      animation is a playback of frames the solver already produced. The
      preview cannot disagree with the outcome because there is nothing for
      it to disagree with.

   3. PROVENANCE ON EVERY CONSTANT. Each number in SPEC carries a tag:
        [official]     a published rulebook or manufacturer specification
        [corroborated] several independent sources agree
        [single]       one source only
        [derived]      computed from other tagged numbers
        [measured]     a published physical measurement
        [CALIBRATED]   tuned by feel, NOT measured -- say so and mean it
      A tag that does not match its constant is worse than no tag, because
      it stops the next person checking. docs/RESEARCH.md carries
      the sources.

   4. DETERMINISM. Same board state + same shot => the same result, always,
      to the last bit. There is no Math.random in this file: randomness comes
      from a seeded generator so any game can be replayed and any bug can be
      reproduced. This is what makes the preview trustworthy.
   ========================================================================== */

const CROK = {};

/* ==========================================================================
   1. SEEDED RANDOMNESS
   --------------------------------------------------------------------------
   mulberry32. Small, fast, well-distributed, and -- the point -- repeatable.
   The AI's aim error is drawn from here, so a game can be replayed exactly.
   ========================================================================== */

function Rng(seed){
  let s = (seed >>> 0) || 1;
  const r = {
    /* uniform [0,1) */
    next(){
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    /* uniform [a,b) */
    range(a, b){ return a + (b - a) * r.next(); },
    /* standard normal, Box-Muller. Human aim error is roughly Gaussian, so
       the AI's error should be too -- uniform error reads as robotic. */
    normal(){
      let u = 0, v = 0;
      while (u === 0) u = r.next();
      while (v === 0) v = r.next();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    },
    int(n){ return Math.floor(r.next() * n) % n; },
    pick(arr){ return arr[r.int(arr.length)]; },
    fork(salt){ return Rng(((s ^ Math.imul(salt|0, 0x9E3779B1)) >>> 0) || 1); },
  };
  return r;
}
CROK.Rng = Rng;

/* ==========================================================================
   2. SMALL VECTOR / SCALAR HELPERS
   ========================================================================== */

const TAU = Math.PI * 2;
const clamp  = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const lerp   = (a, b, t) => a + (b - a) * t;
const hypot  = (x, y) => Math.sqrt(x * x + y * y);
/* 2D cross product: the z of (a x b). For a disc, r is parallel to the
   contact normal, so cross2(r, n) === 0 -- which is exactly why the normal
   impulse for two discs has no angular term. */
const cross2 = (ax, ay, bx, by) => ax * by - ay * bx;
/* shortest signed angle from a to b, in (-PI, PI] */
function angDiff(a, b){
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d <= -Math.PI) d += TAU;
  return d;
}
/* ==========================================================================
   1b. SPEC -- every number in the game, with where it came from
   --------------------------------------------------------------------------
   SI throughout: metres, seconds, kilograms, radians.

   Provenance tags, and they are meant literally:
     [official]     published in a rulebook or a governing body's standard
     [corroborated] several independent sources agree
     [single]       one source only
     [derived]      computed from other tagged numbers in this table
     [CALIBRATED]   tuned so the game behaves like the real one. NOT measured.

   Sources are in docs/RESEARCH.md, keyed by the same names.

   READ THIS BEFORE CHANGING A NUMBER. The board geometry is not guesswork:
   the National Crokinole Association publishes it, and every radius below
   is theirs. The PHYSICS constants are a different matter. There is no
   published coefficient of friction for a crokinole board and there cannot
   be a canonical one -- the NCA regulates who is allowed to apply wax but
   not how much, boards are waxed at the officials' discretion mid
   tournament, and vendors sell deliberately bouncier pegs. Playing speed is
   a property of the afternoon, not of the sport. So the friction and
   restitution values here are calibrated, they say so, and the reasoning
   for each is written down where it can be argued with.
   ========================================================================== */

const SPEC = {
  /* ======================= THE BOARD ==================================== */
  /* NCA tournament standard: "a playing surface with a 26-inch diameter
     that is raised one-half inch above the ditch, onto which the scoring
     circles are drawn at four-inch intervals from the center with the
     radius being 4 inches for the 15-point circle, 8 for the 10-point
     circle, and 12 for the shooting line. This specification shall leave
     the shooting line one inch from the edge of the board at all points.
     The ditch shall be two inches across, and the outer rail shall not be
     thicker than one half inch."
     Note the numbers are published as RADII, not diameters -- older sources
     quote the same circles as 8, 16 and 24 inch diameters, which is the
     commonest way to get this wrong by a factor of two. */
  R_SURFACE:   0.3302,      /* 13 in   -- edge of the raised surface [official] */
  R_OUT:       0.3048,      /* 12 in   -- shooting line AND out-of-play [official] */
  R_10:        0.2032,      /*  8 in   -- 10/5 boundary              [official] */
  R_15:        0.1016,      /*  4 in   -- 15/10 boundary, the guard  [official] */
  R_HOLE:      0.0174625,   /* 1-3/8 in diameter                     [official] */
  HOLE_DEPTH:  0.006,       /* 6 mm +/- 1 mm                         [official] */
  SURF_RAISE:  0.0127,      /* 1/2 in above the ditch                [official] */
  DITCH_W:     0.0508,      /* 2 in across                           [official] */
  RAIL_W:      0.00635,     /* 1/4 in typical, 1/2 in max            [corroborated] */
  LINE_W:      0.0015875,   /* 1/16 in drawn line width              [single] */

  /* The quadrant lines: four radial lines 90 degrees apart, spanning only
     the 5-point band (R_10 out to R_OUT) -- they do not continue inward.
     Phased so each player's quadrant CENTRE faces them squarely. [official
     for the count and spacing, corroborated for the radial extent] */
  QUAD_PHASE:  Math.PI / 4,

  /* ======================= THE PEGS ===================================== */
  /* The NCA specifies NOTHING about pegs -- the word appears once in the
     entire rulebook, as a scoring landmark ("the next region (outside the
     pegs) 10"). Everything here is manufacturer and community consensus,
     and it is genuinely not standardised: one vendor sells pegs chosen for
     "optimal bounce-back", another sells a harder rubber "with a small
     amount of bounce". Two real tournament boards can play differently. */
  N_PEGS:        8,          /* equally spaced                       [corroborated] */
  R_PEG_CIRCLE:  0.1016,     /* centred ON the 15 line, straddling it [corroborated] */
  R_PEG:         0.0047625,  /* 3/8 in OD rubber sleeve              [inferred] */
  PEG_HEIGHT:    0.0127,     /* 1/2 in proud of the surface          [corroborated] */

  /* THE ANGLE THAT DECIDES THE GAME. The pegs are offset 22.5 degrees from
     the quadrant lines, so a gap sits at every multiple of 45 degrees --
     which puts a gap on each quadrant LINE and, more importantly, a gap on
     each player's straight-ahead CENTRELINE. Every player faces a clean
     lane to the 20. Had the pegs been on the lines instead, the game would
     be a different game: the straight shot would be blocked and everything
     would have to be angled. No rulebook states this; it is measured from
     Crokinole Canada's own board diagram and from published build plans.
     [single, corroborated by measurement -- see RESEARCH.md] */
  PEG_PHASE:     Math.PI / 8,

  /* ======================= THE DISCS ==================================== */
  /* The NCA specifies only that discs be wood, of consistent quality, and
     contrasting in colour. Dimensions are the international norm, not a
     rule. Mass is nobody's specification at all: it is computed from the
     size and the density of hard maple, and cross-checks against the one
     published set weight (135 g for 24 discs = 5.6 g each). */
  R_DISC:      0.016,        /* 32 mm diameter +/- 0.5 mm            [corroborated] */
  DISC_THICK:  0.010,        /* 10 mm                                [corroborated] */
  M_DISC:      0.0056,       /* hard maple, 700 kg/m3 x 8.04 cm3     [derived] */
  DISCS_EACH:  8,            /* NCA singles                          [official] */

  /* ======================= THE PHYSICS ================================== */
  G:           9.80665,      /* standard gravity                     [official] */

  /* SURFACE FRICTION. Dry Coulomb, so speed falls linearly and the disc
     actually stops. There is no published figure to use, so this is
     bracketed rather than guessed:
       unwaxed wood on wood              mu ~ 0.2 - 0.35   (too slow: a
                                         full-blooded flick would die before
                                         the 15 ring)
       waxed shuffleboard table          mu ~ 0.02 - 0.03  (a puck crosses
                                         6.7 m from "only a slight push" --
                                         far too fast for a 0.66 m board)
     Crokinole uses the same granular shuffleboard wax but far less of it --
     the NCA lets players wax the DISC from a supply in the ditch, and only
     officials may wax the surface at all -- so it sits well above a
     shuffleboard table and well below bare wood. The value below puts a
     full-power shot's free-running slide at MAX_SLIDE and a disc that just
     reaches the 20 hole at about 0.55 m/s, which is the touch the real game
     has. [CALIBRATED] */
  MU_SURFACE:  0.12,

  /* What a full-power flick would slide on an endless board. This is the
     one knob that sets the whole speed of the game, and it is expressed as
     a DISTANCE because a distance is something you can picture and argue
     with: 2.4 m is about three and a half board diameters, so a
     full-power shot that hits nothing leaves the far side with plenty in
     hand -- which is what happens. V_MAX_SHOT is derived from it and from
     MU_SURFACE, so changing either keeps the two consistent. [CALIBRATED] */
  MAX_SLIDE:   2.4,

  /* SPIN. There are no constants here any more. The coupling between
     sliding and spinning is the exact result for a uniformly loaded disc,
     evaluated from complete elliptic integrals in section 4a -- see the
     comment there. An earlier version of this file used a regularised
     approximation, which matched the pure-sliding and pure-spinning limits
     but was 31% wrong on the spin-down torque halfway between them.
     [primary-source: Weidman & Malhotra / Farkas et al., see RESEARCH.md] */

  /* RESTITUTION. Disc on disc is hard maple edge to hard maple edge: the
     published range for hardwood impacts is roughly 0.4-0.6 and discs
     separate crisply with an audible click, so 0.55. Disc on peg is a
     rubber sleeve over a brass screw, sold explicitly for "bounce-back",
     and is livelier -- but it is also the least standardised number on the
     board, since vendors sell both bouncy and hard sleeves. [CALIBRATED,
     bracketed by published hardwood values] */
  E_DISC:      0.60,         /* hard maple on hard maple   [measured]    */
  E_PEG:       0.60,         /* rubber sleeve, unstandard   [CALIBRATED] */
  MU_DISC:     0.38,         /* wood on wood, tangential   [measured]    */
  MU_PEG:      0.50,         /* rubber on wood, grippier   [CALIBRATED] */

  /* THE 20 HOLE. The geometry is exact and official: a 34.925 mm hole and a
     32 mm disc leave 1.46 mm of centre travel in which the disc is
     "completely in the centre hole" as Rule 6c requires. That tiny number
     is the real reason a 20 is hard.
     The escape dynamics are not official and cannot be: a disc struck hard
     enough tips into the 6 mm recess and rides back out over the far lip,
     which is the rattle-out. V_20_MAX is where that starts to happen.
     [R_CAPTURE derived; V_20_MAX and MU_RIM CALIBRATED] */
  V_20_MAX:    1.15,         /* above this the hole spits it back out  */
  MU_RIM:      0.12,         /* the drag of an edge dipping in the recess */
  A_WELL:      0.30,         /* the inward pull of the unsupported weight */

  /* THE SOLVER. See section 4 for why these values and not others. */
  DT_MAX:       1 / 240,
  DT_MIN:       1e-6,
  SAFE_ADVANCE: 0.20,        /* max closing travel per substep, in disc radii */
  ITERATIONS:   4,           /* contact relaxation passes                     */
  SLOP:         2e-5,        /* penetration left alone, 0.02 mm               */
  BAUMGARTE:    0.7,         /* how much overlap is corrected per pass        */
  REST_CUTOFF:  0.03,        /* below this closing speed, no bounce           */
  V_SLEEP:      0.004,       /* board is still below this                     */
  W_SLEEP:      0.25,
  T_MAX:        14,          /* a shot cannot take longer than this           */
  MAX_SUBSTEPS: 400000,
  SAMPLE_HZ:    120,         /* playback sample rate for the animation        */

  /* THE FLICK. V_MAX_SHOT is derived; the rest is feel. */
  V_MIN_SHOT:     0.08,
  /* AIMING BY DISTANCE. How far the cursor sits from the disc is the whole
     of the shot's force. AIM_MIN is close enough to count as no shot at all,
     which is also how you back out of one. AIM_FULL is full power, and it
     is set by what the hand can comfortably reach on screen rather than by
     anything physical: 0.40 m is about 60% of a board diameter, so maximum
     power sits well inside the board and is not something you have to
     stretch for. [CALIBRATED] */
  AIM_MIN:        0.030,
  AIM_FULL:       0.40,
  /* Finger speed, in BOARD metres per second, to disc speed. A real flick
     is a lever -- the disc leaves the fingernail faster than the finger was
     travelling -- so this is not 1. Set so that a gentle swipe of about one
     board-width per second gives the 0.83-1.20 m/s that sinks a 20, and a
     hard one reaches full power without demanding a superhuman wipe across
     the glass. [CALIBRATED] */
  FLICK_GAIN:     0.75,
  PULL_MAX_RADII: 14,        /* full power pull-back, in disc radii    [CALIBRATED] */
  SPIN_REACH:     1.0,       /* sideways release -> strike offset      [CALIBRATED] */
};

/* --- the derived numbers, computed once so nothing can drift ------------ */
SPEC.I_DISC    = 0.5 * SPEC.M_DISC * SPEC.R_DISC * SPEC.R_DISC;   /* uniform disc */
SPEC.V_MAX_SHOT = Math.sqrt(2 * SPEC.MU_SURFACE * SPEC.G * SPEC.MAX_SLIDE);
SPEC.R_CAPTURE = SPEC.R_HOLE - SPEC.R_DISC;
SPEC.LINE_EPS  = SPEC.LINE_W / 2;
SPEC.R_PLACE   = SPEC.R_OUT - SPEC.R_DISC;

CROK.SPEC = SPEC;
/* ==========================================================================
   3. GEOMETRY -- the board itself
   --------------------------------------------------------------------------
   Everything is SI: metres, seconds, kilograms, radians. The board frame has
   its origin at the centre of the 20 hole, +x right and +y DOWN, matching
   canvas so that board -> screen is a scale, a rotation and a translation
   with no axis flip anywhere. Angles therefore increase clockwise on screen.
   Stated once, here, so nobody has to reverse-engineer it from a minus sign.

   Nothing downstream of this section may contain a board dimension. If a
   radius turns up in the renderer, the rules or the AI, it came from here or
   it is a defect.

   THE ONE PIECE OF GEOMETRY THAT SURPRISES EVERYONE: the circle at 12 inches
   is BOTH the shooting line you must place your disc against AND the
   out-of-play boundary. A disc at rest that merely TOUCHES it is out. So a
   freshly placed disc is sitting exactly on the edge of being dead, and a
   shot too weak to move it off the line loses it. The 1 inch of surface
   outside that line is real wood a disc can travel over -- it just cannot
   stay there.
   ========================================================================== */

const GEO = {};
CROK.GEO = GEO;

GEO.build = function(P){
  /* --- the eight pegs -------------------------------------------------- */
  /* Evenly spaced on the 15-point circle, rotated by PEG_PHASE relative to
     the quadrant dividing lines. That phase decides whether a disc shot
     straight up your quadrant's centre-line meets a peg head-on or threads
     the gap, so it is the single most consequential angle on the board. */
  const pegs = [];
  for (let i = 0; i < P.N_PEGS; i++){
    const a = P.PEG_PHASE + i * (TAU / P.N_PEGS);
    pegs.push({ x: P.R_PEG_CIRCLE * Math.cos(a), y: P.R_PEG_CIRCLE * Math.sin(a), a });
  }

  /* Can a disc pass between two adjacent pegs? Chord between peg centres,
     less both peg radii, less a disc diameter. [derived] -- the harness
     asserts this is positive, because a board where it is not is a board
     where no disc can ever reach the 15 ring. */
  const pegSpacing = 2 * P.R_PEG_CIRCLE * Math.sin(Math.PI / P.N_PEGS);
  const pegGap     = pegSpacing - 2 * P.R_PEG - 2 * P.R_DISC;

  /* Where the centre of a placed disc sits: tangent to the shooting line
     from the inside, so the disc is touching the line as Rule 7e requires
     and no part of it is over the line. [derived] */
  const rPlace = P.R_OUT - P.R_DISC;

  /* The centre of a disc at rest may not be further out than this, or the
     disc is touching the shooting line and is out of play. [derived from
     NCA Rule 8e] */
  const rDead = P.R_OUT - P.R_DISC;

  const geo = {
    P, pegs, pegSpacing, pegGap, rPlace, rDead,

    /* --- quadrants ----------------------------------------------------- */
    /* Two lines through the centre cut the surface into four. In singles the
       players sit opposite each other, so they own opposite quadrants;
       player 0's faces the bottom of the screen. */
    quadCentre(owner){ return owner === 0 ? Math.PI / 2 : -Math.PI / 2; },

    /* THE LEGAL PLACEMENT ARC.
       NCA Rule 7e: the disc must be "touching some part of the outer
       boundary line of the player's quadrant, or touching both the outer
       boundary line and a player's quadrant dividing line."

       Read carefully, that second clause makes the arc WIDER than the
       quadrant, not narrower: at the corner you may push the disc past the
       dividing line as long as it still touches that line. So the angular
       half-span is 45 degrees PLUS the angle the disc's own radius subtends
       at the placement radius -- the centre may sit up to R_DISC beyond the
       line, measured perpendicular. Getting this backwards (shrinking the
       arc) would quietly cost the player the corner placements that make
       cross-board angles possible. [derived from Rule 7e] */
    placement(owner){
      const r = rPlace;
      const halfSpan = Math.PI / 4 + Math.asin(clamp(P.R_DISC / r, 0, 1));
      const c = geo.quadCentre(owner);
      return { r, a0: c - halfSpan, a1: c + halfSpan, c, halfSpan };
    },

    /* clamp a requested placement onto the legal arc */
    snapPlacement(owner, x, y){
      const pl = geo.placement(owner);
      /* work relative to the quadrant centre so the wrap at +-PI cannot bite */
      const d = clamp(angDiff(pl.c, Math.atan2(y, x)), -pl.halfSpan, pl.halfSpan);
      const a = pl.c + d;
      return { x: pl.r * Math.cos(a), y: pl.r * Math.sin(a), a };
    },

    /* --- scoring ------------------------------------------------------- */
    /* NCA Rule 6b: "A disc shall score the lowest value of any region of the
       board that it is touching", and 6d: touching a line scores the lower
       of the two regions. So a disc is in a ring only if it is ENTIRELY
       inside that ring's line, which for a circular footprint is
       |centre| + R_DISC < line radius.

       Rule 6e adds that the test is on the disc's BOTTOM footprint, not its
       silhouette from above -- real discs are chamfered and the top rim
       overhangs. Modelling the disc as a circle of its footprint radius
       makes 6e a no-op, which is the right way to satisfy it. */
    /* The drawn line has real width -- about 1/16 inch -- and it is
       centred on the published radius, so it occupies
       [R - LINE_W/2, R + LINE_W/2]. A disc is clear of a ring's line only
       when its footprint stops short of the line's INNER edge. Ignoring
       the width would hand the player up to 0.8 mm of extra 15 ring, which
       on a 1.46 mm capture window is not a rounding error. */
    zoneOf(x, y){
      const r = hypot(x, y) + P.R_DISC;
      if (r < P.R_15 - P.LINE_EPS) return 15;
      if (r < P.R_10 - P.LINE_EPS) return 10;
      return 5;
    },

    /* THE NO-HIDING TEST -- deliberately NOT the same predicate as scoring.
       NCA Rule 3a.ii requires the disc to end up "touching or within the 15
       line", and touching is enough. A disc touching that line therefore
       SATISFIES the open-board rule but SCORES 10. That asymmetry is real
       and it is why this is its own function and shares nothing with
       zoneOf: one asks "does it reach the line", the other "is it clear of
       the line". */
    touchingOrInsideFifteen(x, y){
      /* reaching the line's OUTER edge is enough -- the generous direction,
         opposite to the way zoneOf reads the same circle */
      return hypot(x, y) - P.R_DISC <= P.R_15 + P.LINE_EPS;
    },

    /* NCA Rule 8e: a disc at rest touching or across the shooting line is
       out of play. */
    /* NCA Rule 8e: a disc at rest "touching or across" the shooting line is
       out of play -- so it dies as soon as its footprint reaches the line's
       inner edge. */
    deadAtRest(x, y){ return hypot(x, y) + P.R_DISC >= P.R_OUT - P.LINE_EPS; },

    /* still physically on the raised surface at all (past this it drops into
       the ditch mid-flight) */
    onSurface(x, y){ return hypot(x, y) <= P.R_SURFACE; },

    /* Find a legal free spot on the placement arc nearest the one asked
       for. The player's own discs can be sitting on their own line, and the
       shooter still has to go somewhere, so walk outwards in both
       directions until there is room. */
    freePlacement(owner, x, y, discs){
      const pl = geo.placement(owner);
      const want = clamp(angDiff(pl.c, Math.atan2(y, x)), -pl.halfSpan, pl.halfSpan);
      const stepA = (2 * P.R_DISC * 1.02) / pl.r;
      const nMax = Math.ceil((2 * pl.halfSpan) / stepA) + 1;
      for (let k = 0; k <= nMax; k++){
        const offs = k === 0 ? [0] : [1, -1];
        for (const sgn of offs){
          const d = clamp(want + sgn * k * stepA, -pl.halfSpan, pl.halfSpan);
          const a = pl.c + d;
          const px = pl.r * Math.cos(a), py = pl.r * Math.sin(a);
          let clear = true;
          for (const dd of discs){
            if (!dd.live) continue;
            if (hypot(dd.x - px, dd.y - py) < 2 * P.R_DISC * 1.001){ clear = false; break; }
          }
          if (clear) return { x: px, y: py, a };
        }
      }
      const a = pl.c + want;
      return { x: pl.r * Math.cos(a), y: pl.r * Math.sin(a), a };
    },
  };
  return geo;
};
/* ==========================================================================
   4. THE PHYSICS
   --------------------------------------------------------------------------
   A purpose-built rigid-disc solver. No library, because the problem is
   narrow enough to solve exactly and broad enough that a general engine
   would fight us on the two things that matter most: bit-exact determinism
   and no tunnelling.

   WHAT IT MODELS

     * Discs as rigid circles with mass m, radius R and moment of inertia
       I = 1/2 m R^2 (a uniform solid cylinder -- crokinole discs are flat
       and homogeneous, so this is exact, not an approximation).

     * SURFACE FRICTION as dry Coulomb friction, NOT viscous damping. This
       is the single most consequential modelling choice in the file, and it
       is not a matter of taste:

         Coulomb (what a disc sliding on a dry powdered board actually does):
           friction force has CONSTANT magnitude mu*m*g regardless of speed
           => speed falls LINEARLY with time,      v(t) = v0 - mu*g*t
           => the disc STOPS, at a finite time     t_stop = v0/(mu*g)
           => distance travelled scales as         d = v0^2 / (2*mu*g)

         Viscous (what `v *= 0.98` every frame gives you):
           force proportional to speed => exponential decay, and the disc
           NEVER stops. It creeps forever, so you need an arbitrary cutoff,
           and doubling the shot power does not double the reach. Every
           casual flick game does this and it is why they feel like air
           hockey rather than like wood.

       Coulomb friction is why "twice as hard" goes four times as far, which
       is the feel a crokinole player has in their hand.

     * SLIDING AND SPINNING ARE COUPLED. A disc that both slides and spins
       cannot decay the two independently: there is one friction budget,
       mu*m*g, shared between stopping the slide and stopping the spin. The
       standard regularised form of the coupling is used (see RESEARCH.md);
       its important consequences are that a spinning disc slides FURTHER
       than a non-spinning one thrown at the same speed, and that sliding
       and spinning die at the same instant.

     * A SPINNING DISC DOES NOT CURVE. For a symmetric disc under uniform
       pressure the net friction force is exactly antiparallel to the centre
       of mass velocity -- the sideways components cancel by symmetry. Spin
       matters on IMPACT (it throws the struck disc sideways and it makes
       the shooter squirt off at an angle) and it matters for how far a disc
       runs, but it does not bend a free disc's path. Curving a disc here
       would be a lie that felt good for a minute.

     * COLLISIONS by impulse, with restitution for the bounce and clamped
       Coulomb friction along the tangent for the spin transfer. Because a
       disc's contact arm r is parallel to the contact normal, the normal
       impulse has no angular term at all -- discs cannot be given spin by a
       head-on hit, only by a glancing one. That falls out of the geometry
       rather than being asserted.

   HOW IT IS STEPPED

     Adaptive substepping with a hard guarantee. Each substep is short
     enough that the CLOSING SPEED of the fastest possible pair moves them
     less than a fraction of a disc radius:

         dt <= SAFE_ADVANCE * R_disc / (2 * v_max)

     so an overlap is always detected while it is still shallow and nothing
     can pass through anything. Substeps get longer as the board slows down,
     so a settled board costs almost nothing.

     Contacts are resolved with several relaxation iterations per substep,
     which is what keeps a cluster of touching discs from buzzing.

   WHY NOT AN EVENT-DRIVEN SOLVER
     Pool simulators advance analytically from one exact impact to the next,
     which is elegant and exact. It works there because a ball's motion
     between impacts has a closed form. Here the sliding/spinning coupling
     makes the closed form unpleasant and the peg cluster makes near
     simultaneous contacts common, which is where analytic advancement gets
     fragile. Fine substeps with a proven advance bound give the same
     tunnel-free guarantee with far less to get wrong -- and it is testable,
     which the harness does.
   ========================================================================== */

const PHYS = {};
CROK.PHYS = PHYS;

/* --- a disc ------------------------------------------------------------- */
function makeDisc(id, owner, x, y){
  return {
    id, owner,          /* owner: 0 = player one, 1 = player two           */
    x, y,               /* centre, metres, board frame (origin = 20 hole)  */
    vx: 0, vy: 0,       /* velocity, m/s                                   */
    a: 0,               /* orientation, radians (cosmetic, but real)       */
    w: 0,               /* spin, rad/s, +ve counter-clockwise              */
    live: true,         /* on the playing surface                          */
    fate: 'live',       /* 'live' | 'ditch' | 'hole' | 'foul'              */
    moved: false,       /* was it touched at all this shot                 */
    shooter: false,     /* is this the disc that was just flicked          */
  };
}
PHYS.makeDisc = makeDisc;

/* --- a world ------------------------------------------------------------ */
/* The world is plain data on purpose: it is cloned for every candidate shot
   the AI considers and for every frame of the trajectory preview, so it has
   to be cheap to copy and free of anything that cannot be. */
PHYS.newWorld = function(geo){
  return { geo, discs: [], nextId: 1, t: 0 };
};

PHYS.cloneWorld = function(w){
  const discs = new Array(w.discs.length);
  for (let i = 0; i < w.discs.length; i++){
    const d = w.discs[i];
    discs[i] = { id: d.id, owner: d.owner, x: d.x, y: d.y, vx: d.vx, vy: d.vy,
                 a: d.a, w: d.w, live: d.live, fate: d.fate,
                 moved: d.moved, shooter: d.shooter, banked: d.banked, voided20: d.voided20 };
  }
  return { geo: w.geo, discs, nextId: w.nextId, t: w.t };
};

PHYS.addDisc = function(w, owner, x, y){
  const d = makeDisc(w.nextId++, owner, x, y);
  w.discs.push(d);
  return d;
};

/* ==========================================================================
   4a. SURFACE FRICTION -- the coupled sliding/spinning decay
   --------------------------------------------------------------------------
   One friction budget, mu*g, split between killing the slide and killing
   the spin according to how fast each is going. With

       s = |v|                      the slide speed
       u = SPIN_ARM * R * |w|       the rim speed due to spin
       q = sqrt(s^2 + u^2)

   the linear deceleration is  mu*g * s/q  and the angular deceleration is
   SPIN_TORQUE * mu*g/R * u/q. When u -> 0 this reduces to plain Coulomb
   sliding (a = mu*g) and when s -> 0 to pure spin-down; in between the two
   share the budget, which is the physical result: they stop together.
   ========================================================================== */

/* --- the exact coupling functions F and T ------------------------------- */
/* These are not an approximation of the coupling, they ARE the coupling.
   For a uniformly loaded disc sliding at v and spinning at omega, with the
   slip ratio eps = v/(R*omega),

       dv/dt     = -mu*g*F(eps)
       domega/dt = -(2*mu*g/R)*T(eps)

   where, with K and E the complete elliptic integrals of the first and
   second kind of MODULUS k (not parameter m = k^2),

     eps <= 1:  F = (4/3pi) [ (e^2+1)E(e) + (e^2-1)K(e) ] / e
                T = (4/9pi) [ (4-2e^2)E(e) + (e^2-1)K(e) ]
     eps >= 1:  F = (4/3pi) [ (e^2+1)E(1/e) - (e^2-1)K(1/e) ]
                T = (4/9pi) [ (4-2e^2)E(1/e) + (2e^2-5+3/e^2)K(1/e) ] / e

   The landmarks the harness checks against: F(0)=0, F(1)=8/3pi, F(inf)=1;
   T(0)=2/3, T(1)=8/9pi, T(inf)=0.

   The consequence worth knowing: rotation reduces linear friction and
   sliding reduces rotational friction, and that negative feedback drives
   every disc towards a universal slip ratio eps0 = 0.653 at which BOTH die
   at the same instant -- whatever it started with. That is a genuine
   prediction of the theory and harness/crok_physics.js measures it.

   Evaluated once into a table at load rather than per substep: the elliptic
   integrals cost an AGM iteration each, and they are called tens of
   thousands of times per shot. The table is indexed on t = eps/(1+eps),
   which folds the whole infinite range of eps into [0,1]. */

/* complete elliptic integrals by the arithmetic-geometric mean */
function ellipKE(k){
  /* K diverges at k = 1, and the formulas above hit that exactly at
     eps = 1 -- where the coefficient multiplying K is exactly zero, so the
     product's limit is 0 but the arithmetic is 0 * Infinity = NaN. Nudging
     the modulus off 1 makes K large but finite and the zero coefficient
     then does its job. The table samples eps = 1 dead on, so this is not a
     hypothetical. */
  if (k >= 1) k = 1 - 1e-15;
  let a = 1, b = Math.sqrt(1 - k * k), c = k;
  let sum = 0.5 * c * c, pow = 1;
  for (let i = 0; i < 40 && Math.abs(c) > 1e-16; i++){
    const an = 0.5 * (a + b);
    const bn = Math.sqrt(a * b);
    c = 0.5 * (a - b);
    a = an; b = bn;
    pow *= 2;
    sum += pow * 0.5 * c * c;
  }
  const K = Math.PI / (2 * a);
  return { K, E: K * (1 - sum) };
}
PHYS.ellipKE = ellipKE;

function couplingExact(eps){
  const P4_3 = 4 / (3 * Math.PI), P4_9 = 4 / (9 * Math.PI);
  if (!isFinite(eps)) return { F: 1, T: 0 };
  if (eps <= 0) return { F: 0, T: 2 / 3 };
  if (eps <= 1){
    const { K, E } = ellipKE(eps);
    const e2 = eps * eps;
    return { F: P4_3 * ((e2 + 1) * E + (e2 - 1) * K) / eps,
             T: P4_9 * ((4 - 2 * e2) * E + (e2 - 1) * K) };
  }
  const { K, E } = ellipKE(1 / eps);
  const e2 = eps * eps;
  return { F: P4_3 * ((e2 + 1) * E - (e2 - 1) * K),
           T: P4_9 * ((4 - 2 * e2) * E + (2 * e2 - 5 + 3 / e2) * K) / eps };
}
PHYS.couplingExact = couplingExact;

const COUPLE_N = 4096;
const COUPLE_F = new Float64Array(COUPLE_N + 1);
const COUPLE_T = new Float64Array(COUPLE_N + 1);
(function buildCouplingTable(){
  for (let i = 0; i <= COUPLE_N; i++){
    const t = i / COUPLE_N;
    /* t = eps/(1+eps)  =>  eps = t/(1-t) */
    const eps = t >= 1 ? Infinity : t / (1 - t);
    const { F, T } = couplingExact(eps);
    COUPLE_F[i] = isFinite(F) ? F : 1;
    COUPLE_T[i] = isFinite(T) ? T : 0;
  }
  /* the two ends are known exactly, so pin them rather than trusting a
     limit that is 0/0 in the formula */
  COUPLE_F[0] = 0;        COUPLE_T[0] = 2 / 3;
  COUPLE_F[COUPLE_N] = 1; COUPLE_T[COUPLE_N] = 0;
})();

PHYS.coupling = function(eps){
  if (!(eps > 0)) return { F: 0, T: 2 / 3 };
  if (!isFinite(eps)) return { F: 1, T: 0 };
  const t = eps / (1 + eps);
  const x = t * COUPLE_N;
  const i = Math.min(COUPLE_N - 1, Math.floor(x));
  const u = x - i;
  return { F: COUPLE_F[i] + (COUPLE_F[i + 1] - COUPLE_F[i]) * u,
           T: COUPLE_T[i] + (COUPLE_T[i + 1] - COUPLE_T[i]) * u };
};

PHYS.frictionAccel = function(P, s, absW){
  const budget = P.MU_SURFACE * P.G;
  if (s < 1e-12 && absW < 1e-9) return { aLin: 0, aAng: 0 };
  const eps = absW < 1e-9 ? Infinity : s / (P.R_DISC * absW);
  const { F, T } = PHYS.coupling(eps);
  return {
    aLin: budget * F,                          /* m/s^2                    */
    aAng: (2 * budget / P.R_DISC) * T,         /* rad/s^2                  */
  };
};

/* ==========================================================================
   4b. THE STEP
   ========================================================================== */

/* Advance every live disc by dt under the coupled friction, stopping any
   disc whose slide or spin would reverse inside the substep (a friction
   force must never push something backwards -- that is the classic
   explicit-integration bug that makes discs jitter forever). */
function integrate(w, P, dt){
  const ds = w.discs;
  for (let i = 0; i < ds.length; i++){
    const d = ds[i];
    if (!d.live) continue;
    d.px = d.x; d.py = d.y;          /* where it was, for the swept tests */
    const s = hypot(d.vx, d.vy), absW = Math.abs(d.w);
    if (s < 1e-12 && absW < 1e-9){ d.vx = 0; d.vy = 0; d.w = 0; continue; }

    const { aLin, aAng } = PHYS.frictionAccel(P, s, absW);

    /* THE RIM AND THE WELL. The 20 hole is a 6 mm recess in the middle of
       the board, and a disc whose footprint laps over its edge is doing two
       things at once:

         it DIPS. The unsupported part of the footprint drops into the
         recess, the disc tips, and its leading edge scrapes and clips the
         far rim on the way out. That is the clack you hear when a shot
         crosses the middle, and the speed it costs is real.

         it is PULLED IN. The weight of the unsupported part is no longer
         held up by anything, so it tips the disc towards the hole, and the
         horizontal component of that pulls the centre of mass inward. The
         hole is a shallow gravity well, which is exactly why a disc that
         dribbles up to it falls in rather than parking on the lip.

       Leaving the well out was a real error, not a simplification: with
       drag alone a gentle 20 attempt braked to a halt 20 mm short of a hole
       it should have dropped into. Both effects scale with how much of the
       footprint is over the hole, and both are [CALIBRATED] -- the
       geometry is exact and official, but the tipping of a real disc into a
       real recess is a three-dimensional problem this stands in for. */
    let rimDrag = 0, wellX = 0, wellY = 0;
    {
      const r = hypot(d.x, d.y);
      const outer = P.R_HOLE + P.R_DISC;
      if (r < outer && r > 1e-9){
        const inner = P.R_HOLE - P.R_DISC;      /* fully over the hole      */
        const overlap = clamp(r <= inner ? 1 : (outer - r) / (outer - inner), 0, 1);
        rimDrag = P.MU_RIM * P.G * overlap;
        const pull = P.A_WELL * P.G * overlap;
        wellX = -(d.x / r) * pull;
        wellY = -(d.y / r) * pull;
      }
    }
    /* the well acts on the velocity directly: it is a force towards the
       middle, not a change in how fast the disc is being slowed */
    if (wellX || wellY){ d.vx += wellX * dt; d.vy += wellY * dt; }
    const aTot = aLin + rimDrag;

    const s2 = hypot(d.vx, d.vy);
    if (s2 > 1e-12){
      const ux = d.vx / s2, uy = d.vy / s2;
      const tStop = s2 / aTot;                   /* when the slide dies    */
      if (tStop <= dt){
        /* stops inside this substep: travel the remaining distance and halt */
        const dist = s2 * tStop - 0.5 * aTot * tStop * tStop;
        d.x += ux * dist; d.y += uy * dist;
        d.a += d.w * tStop;
        d.vx = 0; d.vy = 0;
      } else {
        d.x += d.vx * dt - 0.5 * aTot * ux * dt * dt;
        d.y += d.vy * dt - 0.5 * aTot * uy * dt * dt;
        d.a += d.w * dt;
        const sNew = s2 - aTot * dt;
        d.vx = ux * sNew; d.vy = uy * sNew;
      }
    } else {
      d.a += d.w * dt;
    }

    if (absW > 1e-9){
      const sgn = d.w > 0 ? 1 : -1;
      const wNew = absW - aAng * dt;
      d.w = wNew > 0 ? sgn * wNew : 0;
    }
  }
}

/* --- disc/disc contact -------------------------------------------------- */
/* Impulse with restitution along the normal and clamped Coulomb friction
   along the tangent. Equal masses, so the algebra stays readable.

   Because r_A = +R*n and r_B = -R*n are PARALLEL to the normal:
       cross2(r, n) = 0   =>  the normal impulse has no angular term
       cross2(r, t) = ±R  =>  the tangential impulse is the only source and
                              sink of spin
   The tangential effective mass is therefore
       1/m + 1/m + R^2/I + R^2/I  =  2/m + 4/m  =  6/m
   using I = 1/2 m R^2, i.e. R^2/I = 2/m. */
function resolveDiscPair(A, B, P, out){
  const dx = B.x - A.x, dy = B.y - A.y;
  const dist2 = dx * dx + dy * dy;
  const sum = 2 * P.R_DISC;
  if (dist2 >= sum * sum || dist2 < 1e-18) return false;

  const dist = Math.sqrt(dist2);
  const nx = dx / dist, ny = dy / dist;      /* normal, A -> B             */
  const tx = -ny, ty = nx;                   /* tangent, +90 deg           */
  const R = P.R_DISC;

  /* relative velocity AT THE CONTACT POINT, including the spin terms.
     For body A the arm is +R*n, for B it is -R*n; in 2D omega x r is
     w * (-r.y, r.x). */
  const vAx = A.vx + A.w * (-(R * ny)), vAy = A.vy + A.w * ( (R * nx));
  const vBx = B.vx - B.w * (-(R * ny)), vBy = B.vy - B.w * ( (R * nx));
  const rvx = vBx - vAx, rvy = vBy - vAy;
  const vn = rvx * nx + rvy * ny;
  const vt = rvx * tx + rvy * ty;

  /* separate the overlap even if they are already moving apart, otherwise
     shallow penetrations accumulate into drift */
  const pen = sum - dist;
  if (pen > 0){
    const corr = (pen - P.SLOP > 0 ? pen - P.SLOP : 0) * P.BAUMGARTE * 0.5;
    A.x -= nx * corr; A.y -= ny * corr;
    B.x += nx * corr; B.y += ny * corr;
  }
  if (vn >= 0) return false;                 /* already separating         */

  const invM = 1 / P.M_DISC;
  /* restitution cutoff: a slow contact must not bounce, or a cluster of
     touching discs never goes to sleep */
  const e = (-vn < P.REST_CUTOFF) ? 0 : P.E_DISC;
  const jn = -(1 + e) * vn / (invM + invM);

  /* tangential: clamped by mu * jn (Coulomb) */
  const invMt = invM + invM + (R * R) / P.I_DISC + (R * R) / P.I_DISC;
  let jt = -vt / invMt;
  const jtMax = P.MU_DISC * jn;
  if (jt > jtMax) jt = jtMax; else if (jt < -jtMax) jt = -jtMax;

  const px = jn * nx + jt * tx, py = jn * ny + jt * ty;
  A.vx -= px * invM; A.vy -= py * invM;
  B.vx += px * invM; B.vy += py * invM;
  /* only jt torques the discs: cross2(+R*n, t) = +R, cross2(-R*n, t) = -R */
  A.w -= ( R * jt) / P.I_DISC;
  B.w -= ( R * jt) / P.I_DISC;

  A.moved = B.moved = true;
  if (out) out.push({ kind: 'disc', a: A.id, b: B.id, x: A.x + nx * R, y: A.y + ny * R,
                      impulse: Math.abs(jn), t: 0 });
  return true;
}

/* --- disc/peg contact --------------------------------------------------- */
/* The same equations in the infinite-mass limit: the peg's 1/m and 1/I are
   zero, so the tangential effective mass is 1/m + R^2/I = 3/m. */
function resolveDiscPeg(d, px, py, P, out){
  const dx = d.x - px, dy = d.y - py;
  const dist2 = dx * dx + dy * dy;
  const sum = P.R_DISC + P.R_PEG;
  if (dist2 >= sum * sum) return false;

  let dist = Math.sqrt(dist2), nx, ny;
  if (dist < 1e-9){ nx = 1; ny = 0; dist = 0; }   /* dead centre: pick one */
  else { nx = dx / dist; ny = dy / dist; }        /* normal, peg -> disc   */
  const tx = -ny, ty = nx;
  const R = P.R_DISC;

  const pen = sum - dist;
  if (pen > 0){
    const corr = (pen - P.SLOP > 0 ? pen - P.SLOP : 0) * P.BAUMGARTE;
    d.x += nx * corr; d.y += ny * corr;
  }

  /* contact arm on the disc points from its centre TOWARDS the peg: -R*n */
  const cvx = d.vx + d.w * ( (R * ny)), cvy = d.vy + d.w * (-(R * nx));
  const vn = cvx * nx + cvy * ny;
  const vt = cvx * tx + cvy * ty;
  if (vn >= 0) return false;

  const invM = 1 / P.M_DISC;
  const e = (-vn < P.REST_CUTOFF) ? 0 : P.E_PEG;
  const jn = -(1 + e) * vn / invM;

  const invMt = invM + (R * R) / P.I_DISC;
  let jt = -vt / invMt;
  const jtMax = P.MU_PEG * jn;
  if (jt > jtMax) jt = jtMax; else if (jt < -jtMax) jt = -jtMax;

  d.vx += (jn * nx + jt * tx) * invM;
  d.vy += (jn * ny + jt * ty) * invM;
  /* cross2(-R*n, t) = -R */
  d.w += (-R * jt) / P.I_DISC;

  /* deliberately NOT setting d.moved: the foul rule turns on which discs
     were STRUCK, and a static peg strikes nothing -- a disc that reaches a
     peg was already moving, so it was already marked by whatever moved it */
  if (out) out.push({ kind: 'peg', a: d.id, x: px + nx * P.R_PEG, y: py + ny * P.R_PEG,
                      impulse: Math.abs(jn), t: 0 });
  return true;
}

/* --- the fates: the ditch and the 20 hole ------------------------------- */

/* Closest approach of the segment A->B to the origin. Used because the 20
   hole's capture window is TINY -- 1.59 mm of centre travel on a real board
   -- and a substep long enough to be efficient is long enough to step clean
   over it. Testing the swept segment instead of the endpoint means a shot
   cannot miss a 20 it geometrically went through. */
function nearestToCentre(x0, y0, x1, y1){
  const dx = x1 - x0, dy = y1 - y0;
  const L2 = dx * dx + dy * dy;
  let t = L2 > 1e-18 ? -(x0 * dx + y0 * dy) / L2 : 0;
  t = clamp(t, 0, 1);
  const x = x0 + dx * t, y = y0 + dy * t;
  return { t, x, y, d: hypot(x, y) };
}
PHYS.nearestToCentre = nearestToCentre;

function applyFates(w, P, dt, out){
  const ds = w.discs;
  for (let i = 0; i < ds.length; i++){
    const d = ds[i];
    if (!d.live) continue;

    /* THE DITCH. Only when the centre leaves the raised playing surface
       altogether. Note what this does NOT do: it does not kill a disc that
       has merely crossed the shooting line at 12 inches. There is a full
       inch of real wood outside that line, and a disc crossing it
       tangentially can travel over that margin and re-enter -- which is
       exactly the NCA's Spinning Disc Rule (8g), and it falls out of the
       geometry here rather than needing a rule of its own. A disc still out
       there when everything stops is picked up by RULES.endTurn, because
       nobody clears a disc off the board mid-shot.

       The surface stands half an inch above the ditch, so a disc that has
       dropped in cannot climb back onto the board. That is why the Damage
       Stays Rule (8h) -- a disc rebounding off the backboard into play --
       cannot arise here, and is noted rather than implemented. */
    if (hypot(d.x, d.y) > P.R_SURFACE){
      d.live = false; d.fate = 'ditch'; d.vx = d.vy = d.w = 0;
      if (out) out.push({ kind: 'ditch', a: d.id, x: d.x, y: d.y, impulse: 0, t: 0 });
      continue;
    }

    /* THE 20. Rule 6c: "a disc must be completely in the centre hole and
       lying flat". Completely in, for a 34.9 mm hole and a 31.75 mm disc,
       means the centre within 1.59 mm of dead centre. That is the whole
       reason a 20 is hard: the target is 3.2 mm wide, not that you have to
       be gentle.

       Once a disc is fully unsupported it tips into the recess and its
       leading edge is caught by the far wall, so a disc that gets there is
       normally kept. Struck hard enough, though, it has ample energy to
       ride back over the 6 mm rim and out -- which is the rattle-out every
       player knows -- so there is a speed ceiling above which the hole
       spits it back. That ceiling is [CALIBRATED], not measured: the
       geometry above is exact and sourced, the escape dynamics are a
       three-dimensional tipping problem standing in for honestly. */
    /* THERE ARE TWO WAYS IN, and they are different physics.

       IN PASSING. The disc crosses the hole completely inside it -- centre
       within R_CAPTURE = 1.46 mm of dead centre -- slowly enough not to
       ride back out over the far lip. Tested against the SWEPT path, not
       the endpoint, because a substep is longer than the window.

       BY TIPPING. The disc comes to rest with its centre of mass over the
       hole. It is then sitting on nothing and tips in, and because the hole
       is WIDER than the disc (34.93 mm against 32 mm) it cannot wedge on
       the lip -- it settles flat at the bottom, which is Rule 6c's
       "completely in the centre hole and lying flat". A disc that stops
       with its centre just OUTSIDE the hole rests on the lip instead and
       stays out, which is the leaner every player has seen.

       Getting this wrong is what made the 20 window non-monotonic in an
       earlier version: capture was tested on footprint overlap rather than
       on where the weight was, so a shot 5 mm off centre stayed out while
       one 8 mm off dropped in. */
    const rNow = hypot(d.x, d.y);
    const atRest = hypot(d.vx, d.vy) <= P.V_SLEEP;
    let sink = false;
    if (atRest && rNow < P.R_HOLE) sink = true;
    else if (P.R_CAPTURE > 0){
      const near = nearestToCentre(d.px !== undefined ? d.px : d.x,
                                   d.py !== undefined ? d.py : d.y, d.x, d.y);
      if (near.d < P.R_CAPTURE && hypot(d.vx, d.vy) <= P.V_20_MAX) sink = true;
    }
    if (sink){
      d.live = false; d.fate = 'hole'; d.vx = d.vy = d.w = 0;
      d.x = 0; d.y = 0;
      if (out) out.push({ kind: 'hole', a: d.id, x: 0, y: 0, impulse: 0, t: 0 });
    }
  }
}

/* --- is anything still happening --------------------------------------- */
function maxSpeed(w){
  let m = 0;
  for (let i = 0; i < w.discs.length; i++){
    const d = w.discs[i];
    if (!d.live) continue;
    const s = hypot(d.vx, d.vy);
    if (s > m) m = s;
  }
  return m;
}
function anyMotion(w, P){
  for (let i = 0; i < w.discs.length; i++){
    const d = w.discs[i];
    if (!d.live) continue;
    if (hypot(d.vx, d.vy) > P.V_SLEEP) return true;
    if (Math.abs(d.w) > P.W_SLEEP) return true;
  }
  return false;
}

/* --- one substep ------------------------------------------------------- */
function substep(w, P, dt, out){
  integrate(w, P, dt);

  const ds = w.discs, pegs = w.geo.pegs;
  /* Relaxation. One pass resolves an isolated hit; a disc wedged between
     two pegs, or a shot into a packed cluster, needs the passes to talk to
     each other. Contacts already separating cost almost nothing, so the
     usual case does not pay for the worst case. */
  for (let it = 0; it < P.ITERATIONS; it++){
    let touched = false;
    for (let i = 0; i < ds.length; i++){
      const A = ds[i];
      if (!A.live) continue;
      for (let j = i + 1; j < ds.length; j++){
        const B = ds[j];
        if (!B.live) continue;
        if (resolveDiscPair(A, B, P, it === 0 ? out : null)) touched = true;
      }
      for (let k = 0; k < pegs.length; k++){
        if (resolveDiscPeg(A, pegs[k].x, pegs[k].y, P, it === 0 ? out : null)) touched = true;
      }
    }
    if (!touched) break;
  }

  applyFates(w, P, dt, out);
  w.t += dt;
}

/* ==========================================================================
   4c. RUN A SHOT TO REST
   --------------------------------------------------------------------------
   Returns everything anyone needs to know about the shot, computed in one
   go, the instant the flick is released:

     frames   the position of every disc, sampled at a fixed rate, for the
              animation to play back. Physics does not run on the render
              clock; the render clock reads what physics already decided.
     path     the shooter's own centre track, for the preview line
     events   every contact, in order, with where and how hard
     world    the settled board

   This is the ONE call. The preview uses it, the shot uses it, and the AI
   uses it a few hundred times a turn to pick a shot. They cannot disagree.
   ========================================================================== */

PHYS.runShot = function(world, shot, opts){
  const P = world.geo.P;
  const o = opts || {};
  const wantFrames = o.frames !== false;
  const w = o.inPlace ? world : PHYS.cloneWorld(world);

  /* the shooter is placed and flicked */
  let shooterId = -1;
  if (shot){
    const d = PHYS.addDisc(w, shot.owner, shot.x, shot.y);
    d.vx = shot.vx; d.vy = shot.vy; d.w = shot.w || 0;
    d.shooter = true; d.moved = true;
    shooterId = d.id;
    for (let i = 0; i < w.discs.length; i++) if (w.discs[i].id !== shooterId) w.discs[i].moved = false;
  }

  const events = [];
  const frames = wantFrames ? [] : null;
  const path   = [];
  const sampleDt = 1 / P.SAMPLE_HZ;
  let sampleAcc = 0, tSim = 0;
  const shooter = shooterId >= 0 ? w.discs[w.discs.length - 1] : null;

  const snap = () => {
    if (frames){
      const f = new Float32Array(w.discs.length * 4);
      for (let i = 0; i < w.discs.length; i++){
        const d = w.discs[i];
        f[i * 4] = d.x; f[i * 4 + 1] = d.y; f[i * 4 + 2] = d.a;
        f[i * 4 + 3] = d.live ? 1 : (d.fate === 'hole' ? 2 : 3);
      }
      frames.push(f);
    }
    if (shooter && shooter.live) path.push(shooter.x, shooter.y);
  };
  snap();

  let guard = 0;
  while (anyMotion(w, P) && tSim < P.T_MAX && guard++ < P.MAX_SUBSTEPS){
    /* THE ADVANCE BOUND. Two discs closing head-on approach at up to twice
       the fastest speed on the board, so a substep short enough that the
       PAIR moves less than SAFE_ADVANCE * R together cannot let either pass
       through the other. This is the whole anti-tunnelling argument, and
       harness/crok_physics.js fires shots at the pegs until it is satisfied
       nothing slips past. */
    const vm = maxSpeed(w);
    let dt = P.DT_MAX;
    if (vm > 1e-9) dt = Math.min(dt, (P.SAFE_ADVANCE * P.R_DISC) / (2 * vm));
    if (dt < P.DT_MIN) dt = P.DT_MIN;
    /* never overshoot the next animation sample: frames stay evenly spaced */
    if (sampleAcc + dt > sampleDt) dt = sampleDt - sampleAcc;

    const before = events.length;
    substep(w, P, dt, events);
    for (let i = before; i < events.length; i++) events[i].t = tSim;

    tSim += dt; sampleAcc += dt;
    if (sampleAcc >= sampleDt - 1e-12){ sampleAcc = 0; snap(); }
  }
  /* park everything: no residual creep in the settled state */
  for (let i = 0; i < w.discs.length; i++){ w.discs[i].vx = 0; w.discs[i].vy = 0; w.discs[i].w = 0; }
  snap();

  return {
    world: w, frames, path, events,
    shooterId,
    duration: tSim,
    settled: tSim < P.T_MAX,
  };
};
/* ==========================================================================
   5. THE RULES
   --------------------------------------------------------------------------
   The NCA "Official Rules of Crokinole" (ratified 6 May 2026), written as
   logic. Rule text and sources are in docs/RESEARCH.md. Where
   leagues differ the choice is marked [INTERPRETATION] with its reason.

   FOUR THINGS THE INTERNET GETS WRONG, ALL OF WHICH ARE IMPLEMENTED THE
   RULEBOOK'S WAY HERE:

   1. SCORING IS NOT THE MARGIN. The raw disc tally decides only who won the
      round; the winner then takes 2 points, a tie is 1 each, a loss 0
      (Rule 2a.iv). The margin is thrown away. The "winner is awarded the
      difference, first to 100" system that Wikipedia documents is the
      traditional house game, not tournament crokinole. Both totals are
      shown on screen -- the tally because it is what you are playing for
      inside the round, the 2/1/0 because it is what wins the match.

   2. TOUCHING THE 15 LINE IS ENOUGH for the open-board rule (Rule 3a.ii,
      "touching or within the 15 line"), even though a disc touching that
      line only SCORES 10 (Rule 6d). Same circle, two different tests. They
      deliberately do not share a helper.

   3. A FOUL DOES NOT PUT ANYTHING BACK. The shooter and every disc it
      disturbed are removed, and any 20 sunk on that shot is voided
      (Rule 3b). Nothing is restored to where it was -- the rulebook's
      instinct is the opposite, and says so in the Damage Stays Rule (8h).
      Restoration appears in exactly one source and is labelled optional.

   4. THE 20 HOLE IS A SINK, NOT A ZONE. A disc completely in the hole and
      lying flat is lifted out after that turn and banked (Rule 2a.ii). It
      is safe for the rest of the round and cannot be knocked back out. The
      childhood memory of discs stacking up in the hole is a house rule.

   WHAT IS KNOWINGLY NOT MODELLED: discs cannot ride up on top of each other
   in two dimensions, so the NCA's stacking and leaning edge cases -- a disc
   settled flat on another scores what the lower one scores, a leaner scores
   the lowest region it touches -- cannot arise. That is a real difference
   from the physical game and it is written down rather than hidden.
   ========================================================================== */

const RULES = {};
CROK.RULES = RULES;

RULES.DISCS_PER_ROUND = 8;      /* NCA Rule 4a, singles                    */
RULES.ROUNDS_PER_GAME = 4;      /* NCA Rule 2b                             */
RULES.WIN_PTS = 2;              /* NCA Rule 2a.iv                          */
RULES.TIE_PTS = 1;

/* --- who is on the board ------------------------------------------------ */
RULES.hasLiveDisc = function(world, owner){
  for (const d of world.discs) if (d.live && d.owner === owner) return true;
  return false;
};

/* --- did one of my discs strike one of theirs? -------------------------- */
/* NCA Rule 3a.i: "If any opposing discs are in play, at least one of the
   shooter's discs must strike an opposing disc either directly, or by
   bumping one of his/her discs already in play into an opposing disc."

   Chain length is unlimited and ordering is unconstrained, so the test
   collapses to a single sweep of the contact log: did ANY disc of the
   shooter's colour touch ANY disc of the opponent's colour at any point
   during the shot? That is equivalent to walking the contact chain, because
   the energy can only have come from the shooter -- the first opponent disc
   touched in any chain is necessarily touched by one of the shooter's.

   Pegs do not enter into it. No rulebook mentions peg contact in connection
   with shot validity, and Rule 3a.i imposes exactly one condition with no
   first-contact clause, so ricocheting off a peg on the way in is an
   ordinary shot. [INTERPRETATION -- see the open question in RESEARCH.md] */
RULES.struckOpponent = function(events, shooterOwner, discsById){
  for (const ev of events){
    if (ev.kind !== 'disc') continue;
    const A = discsById.get(ev.a), B = discsById.get(ev.b);
    if (!A || !B) continue;
    if (A.owner !== B.owner) return true;
  }
  return false;
};

/* ==========================================================================
   5a. IS THE SHOT LEGAL?
   --------------------------------------------------------------------------
   The two modes are mutually exclusive and chosen by one question asked at
   the moment the shot is taken: does the opponent have anything on the
   surface? Returns why as well as whether, so the HUD can tell the player
   what they did instead of silently taking their disc.
   ========================================================================== */

RULES.judgeShot = function(geo, before, result, owner){
  const byId = new Map();
  for (const d of result.world.discs) byId.set(d.id, d);
  const shooter = byId.get(result.shooterId);

  if (RULES.hasLiveDisc(before, 1 - owner)){
    /* --- mode one: they have discs out there, hit one ------------------ */
    if (!RULES.struckOpponent(result.events, owner, byId)){
      return { valid: false, reason: 'no-contact',
               text: 'Foul — with an opponent disc on the board your shot must hit one' };
    }
    return { valid: true, reason: 'contact' };
  }

  /* --- mode two: the board is theirs-empty, so no hiding ---------------- */
  /* Rule 3a.ii: "the shooting disc OR at least one disc struck during the
     shot must end up touching or within the 15 line. (A 20 is considered
     within the 15 line)". Note BOTH generosities: it need not be the
     shooter, and touching is enough. */
  for (const d of result.world.discs){
    const involved = d.shooter || d.moved;
    if (!involved) continue;
    if (d.fate === 'hole') return { valid: true, reason: 'twenty' };
    if (d.live && geo.touchingOrInsideFifteen(d.x, d.y)) return { valid: true, reason: 'open-ok' };
  }
  return { valid: false, reason: 'open-short',
